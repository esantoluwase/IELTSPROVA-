<body>

<div class="container">

    <div class="header">
        <h1>🏆 Weekly <span>Challenges</span></h1>
    </div>

    <div id="challengesContainer">
        <!-- Rendered by JavaScript -->
    </div>

    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
</div>

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCV8z2TqjtwR5LpSMlGn5jCsvw1IM5vMFQ",
        authDomain: "ieltsprova.firebaseapp.com",
        projectId: "ieltsprova",
        storageBucket: "ieltsprova.firebasestorage.app",
        messagingSenderId: "812300970124",
        appId: "1:812300970124:web:992398c08c151ae97df3a9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // CHALLENGE DATA
    // ============================================================
    const challenges = [
        {
            id: 1,
            title: "📖 Reading Marathon",
            desc: "Complete 5 reading tests this week",
            tasks: [
                { name: "Reading Test 1", done: false },
                { name: "Reading Test 2", done: false },
                { name: "Reading Test 3", done: false },
                { name: "Reading Test 4", done: false },
                { name: "Reading Test 5", done: false }
            ],
            status: "active"
        },
        {
            id: 2,
            title: "✍️ Writing Challenge",
            desc: "Submit 3 writing tasks this week",
            tasks: [
                { name: "Task 1: Chart Description", done: true },
                { name: "Task 2: Opinion Essay", done: false },
                { name: "Task 3: Problem-Solution Essay", done: false }
            ],
            status: "active"
        },
        {
            id: 3,
            title: "🎧 Listening Sprint",
            desc: "Complete 4 listening tests",
            tasks: [
                { name: "Listening Test 1", done: true },
                { name: "Listening Test 2", done: true },
                { name: "Listening Test 3", done: false },
                { name: "Listening Test 4", done: false }
            ],
            status: "active"
        },
        {
            id: 4,
            title: "🗣️ Speaking Practice",
            desc: "Record 3 speaking answers",
            tasks: [
                { name: "Part 1: Introduction", done: true },
                { name: "Part 2: Cue Card", done: true },
                { name: "Part 3: Discussion", done: false }
            ],
            status: "active"
        },
        {
            id: 5,
            title: "🔥 All-Rounder",
            desc: "Complete one test in each module",
            tasks: [
                { name: "Reading Test", done: false },
                { name: "Writing Task", done: false },
                { name: "Listening Test", done: false },
                { name: "Speaking Practice", done: false }
            ],
            status: "upcoming"
        }
    ];

    // ============================================================
    // RENDER CHALLENGES
    // ============================================================
    function renderChallenges() {
        const container = document.getElementById('challengesContainer');

        container.innerHTML = challenges.map(challenge => {
            const total = challenge.tasks.length;
            const completed = challenge.tasks.filter(t => t.done).length;
            const progress = Math.round((completed / total) * 100);

            const statusBadge = challenge.status === 'active' ? 'active' : 'upcoming';
            const statusLabel = challenge.status === 'active' ? '🟢 Active' : '📅 Upcoming';

            return `
                <div class="challenge-card">
                    <div class="challenge-header">
                        <span class="title">${challenge.title}</span>
                        <span class="badge ${statusBadge}">${statusLabel}</span>
                    </div>
                    <div class="challenge-desc">${challenge.desc}</div>
                    <div style="background:#f3edf7;border-radius:50px;height:6px;overflow:hidden;margin:0.5rem 0;">
                        <div style="height:100%;width:${progress}%;background:linear-gradient(90deg,#4A148C,#7B1FA2);border-radius:50px;"></div>
                    </div>
                    <div style="font-size:0.8rem;color:#7B6A8A;margin-bottom:0.5rem;">${completed} / ${total} completed</div>
                    <div class="tasks">
                        ${challenge.tasks.map(task => `
                            <div class="task">
                                <span class="task-name">${task.done ? '✅' : '⬜'} ${task.name}</span>
                                <span class="task-status ${task.done ? 'done' : 'pending'}">
                                    ${task.done ? '✅ Done' : '⏳ Pending'}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn btn-primary" onclick="window.location.href='reading-test.html'" style="margin-top:0.8rem;">
                        <i class="fas fa-play"></i> Start Challenge
                    </button>
                </div>
            `;
        }).join('');
    }

    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'index.html';
            return;
        }
        renderChallenges();
    });
</script>
