<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ===== GOOGLE VERIFICATION ===== -->
    <meta name="google-site-verification" content="XOXi-f20RDZxDCBM8hRzcJSoeVBTUPBZU8luGgoW8Gw" />
    
    <title>IELTSProva — AI Speaking Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- ===== QUESTION BANK ===== -->
    <script src="questions.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f0ff;
            color: #1a0a2e;
            padding: 2rem;
            line-height: 1.7;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 2.5rem;
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(74, 20, 140, 0.06);
            border: 1px solid #f0e8f5;
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .test-header h1 { font-size: 1.8rem; color: #4A148C; }
        .test-header h1 i { color: #7B1FA2; }
        .test-header .meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .timer-box {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
        }
        .plan-badge {
            padding: 0.3rem 1.2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .plan-badge.pro { background: #fff8e1; color: #f57f17; }
        .plan-badge.proplus { background: #fce4ec; color: #c62828; }

        /* ===== SECTION CARD ===== */
        .section-card {
            background: white;
            border-radius: 20px;
            border: 2px solid #f0e8f5;
            margin-bottom: 1.5rem;
            overflow: hidden;
            transition: 0.3s;
        }
        .section-card:hover { border-color: #7B1FA2; }
        .section-card.locked { opacity: 0.7; border-color: #e0d6e8; }
        .section-card.locked .section-header { background: #f5f0ff; }
        .section-card .section-header {
            padding: 1.2rem 1.8rem;
            background: #faf7ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .section-card .section-header .title {
            font-weight: 700;
            color: #4A148C;
            font-size: 1.1rem;
        }
        .section-card .section-header .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
        }
        .section-card .section-header .badge.free { background: #e8f5e9; color: #2e7d32; }
        .section-card .section-header .badge.pro { background: #fff8e1; color: #f57f17; }
        .section-card .section-header .badge.proplus { background: #fce4ec; color: #c62828; }
        .section-card .section-body { padding: 1.2rem 1.8rem; }
        .section-card .section-body .topic-list { margin-top: 0.5rem; }
        .section-card .section-body .topic-item {
            background: #faf7ff;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem;
            border-left: 4px solid #7B1FA2;
        }
        .section-card .section-body .topic-item .t-title {
            font-weight: 600;
            color: #4A148C;
            font-size: 0.95rem;
        }
        .section-card .section-body .topic-item .t-part {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
        }
        .section-card .section-body .topic-item .t-part.part1 { background: #e3f2fd; color: #0d47a1; }
        .section-card .section-body .topic-item .t-part.part2 { background: #fff8e1; color: #f57f17; }
        .section-card .section-body .topic-item .t-part.part3 { background: #fce4ec; color: #c62828; }
        .section-card .section-body .locked-overlay {
            background: #f5f0ff;
            padding: 1.5rem;
            border-radius: 16px;
            text-align: center;
            border: 2px dashed #7B1FA2;
        }
        .section-card .section-body .locked-overlay .lock-icon { font-size: 2rem; color: #7B1FA2; display: block; margin-bottom: 0.3rem; }
        .section-card .section-body .locked-overlay .upgrade-link {
            display: inline-block;
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            padding: 0.5rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            margin-top: 0.5rem;
            transition: 0.3s;
        }
        .section-card .section-body .locked-overlay .upgrade-link:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(74,20,140,0.3);
        }

        .ai-examiner {
            background: linear-gradient(135deg, #f3edf7, #faf7ff);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            border: 2px solid #7B1FA2;
            margin-bottom: 1.5rem;
        }
        .ai-examiner .avatar { font-size: 4rem; display: block; margin-bottom: 0.5rem; }
        .ai-examiner .status { font-size: 1rem; color: #4A148C; font-weight: 600; min-height: 2rem; }
        .ai-examiner .transcript-box {
            background: white;
            padding: 1rem;
            border-radius: 14px;
            margin: 1rem 0;
            text-align: left;
            min-height: 60px;
            border: 1px solid #f0e8f5;
            font-size: 0.95rem;
            color: #3d2a4a;
        }
        .ai-examiner .transcript-box .label { font-weight: 700; color: #4A148C; font-size: 0.8rem; display: block; margin-bottom: 0.3rem; }
        .mic-btn {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(74, 20, 140, 0.3);
        }
        .mic-btn:hover { transform: scale(1.05); box-shadow: 0 8px 35px rgba(74, 20, 140, 0.4); }
        .mic-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .mic-btn.recording {
            background: linear-gradient(135deg, #e53935, #c62828);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .speaking-area textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #f0e8f5;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            min-height: 100px;
            resize: vertical;
            transition: 0.3s;
            line-height: 1.6;
        }
        .speaking-area textarea:focus { outline: none; border-color: #7B1FA2; }
        .cue-card {
            background: #faf7ff;
            padding: 1.5rem;
            border-radius: 16px;
            border: 2px solid #7B1FA2;
            margin: 1rem 0;
        }
        .cue-card .topic { font-weight: 700; color: #4A148C; font-size: 1.2rem; }
        .cue-card .bullets { list-style: none; padding-left: 0; }
        .cue-card .bullets li { padding: 0.2rem 0; color: #3d2a4a; }
        .cue-card .bullets li::before { content: "• "; color: #7B1FA2; font-weight: 700; }

        .actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        .btn {
            padding: 0.8rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 20, 140, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 20, 140, 0.3);
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: #f3edf7; color: #4A148C; }
        .btn-secondary:hover { background: #e5d9ed; }
        .btn-success { background: linear-gradient(135deg, #2e7d32, #43a047); color: white; }

        .result {
            margin-top: 2rem;
            padding: 1.8rem;
            border-radius: 20px;
            background: #faf7ff;
            border: 2px solid #7B1FA2;
            display: none;
        }
        .result.show { display: block; }
        .result .score-big { font-size: 3rem; font-weight: 900; color: #4A148C; }
        .result .feedback-text { font-size: 1.05rem; margin-top: 0.5rem; line-height: 1.8; }
        .result .feedback-text .band {
            display: inline-block;
            background: #FFD700;
            color: #4A148C;
            padding: 0.2rem 1rem;
            border-radius: 50px;
            font-weight: 700;
        }
        .result .save-status { margin-top: 0.8rem; font-size: 0.95rem; }
        .result .part-breakdown {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }
        .result .part-breakdown .part-result {
            background: white;
            padding: 1rem;
            border-radius: 14px;
            border: 1px solid #f0e8f5;
            text-align: center;
        }
        .result .part-breakdown .part-result .label { font-size: 0.8rem; color: #7B6A8A; }
        .result .part-breakdown .part-result .value { font-size: 1.8rem; font-weight: 800; color: #4A148C; }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #4A148C;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }

        .login-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .login-overlay.active { display: flex; }
        .login-overlay .modal-box {
            background: white;
            border-radius: 32px;
            padding: 3rem;
            max-width: 440px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        .login-overlay .modal-box .icon { font-size: 4rem; display: block; margin-bottom: 0.5rem; }
        .login-overlay .modal-box h2 { color: #4A148C; font-size: 1.8rem; margin-bottom: 0.5rem; }
        .login-overlay .modal-box p { color: #7B6A8A; margin-bottom: 1.5rem; }
        .login-overlay .modal-box .btn-login {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin: 0 0.5rem;
            text-decoration: none;
            display: inline-block;
        }
        .login-overlay .modal-box .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(74,20,140,0.3);
        }
        .login-overlay .modal-box .btn-secondary {
            background: #f3edf7;
            color: #4A148C;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .login-overlay .modal-box .btn-secondary:hover { background: #e5d9ed; }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .container { padding: 1.5rem; }
            .test-header { flex-direction: column; align-items: flex-start; }
            .actions { flex-direction: column; }
            .btn { justify-content: center; }
            .result .part-breakdown { grid-template-columns: 1fr; }
            .mic-btn { width: 100%; }
            .login-overlay .modal-box { padding: 2rem; }
            .section-card .section-header { flex-direction: column; align-items: flex-start; }
            .section-card .section-body .topic-item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<!-- ===== LOGIN OVERLAY ===== -->
<div class="login-overlay" id="loginOverlay">
    <div class="modal-box">
        <span class="icon">🔒</span>
        <h2>Login Required</h2>
        <p>You need to be logged in to take this test.</p>
        <div>
            <a href="index.html" class="btn-login"><i class="fas fa-sign-in-alt"></i> Go to Login</a>
            <a href="index.html" class="btn-secondary"><i class="fas fa-home"></i> Home</a>
        </div>
        <p style="margin-top:1rem; font-size:0.85rem; color:#7B6A8A;">
            Don't have an account? <a href="index.html" style="color:#4A148C; font-weight:600;">Sign up free</a>
        </p>
    </div>
</div>

<!-- ===== TEST CONTENT ===== -->
<div class="container" id="testContent" style="display:none;">
    <div class="test-header">
        <h1><i class="fas fa-microphone"></i> AI Speaking Test</h1>
        <div class="meta">
            <span class="timer-box"><i class="fas fa-clock"></i> <span id="timerDisplay">15:00</span></span>
            <span class="plan-badge" id="planBadge">Free</span>
        </div>
    </div>

    <div id="sectionsContainer">
        <!-- Sections will be rendered by JavaScript -->
    </div>

    <div class="actions">
        <button type="button" class="btn btn-primary" id="startTestBtn" onclick="startTest()"><i class="fas fa-play"></i> Start Free Test</button>
        <button type="button" class="btn btn-secondary" onclick="resetTest()"><i class="fas fa-sync-alt"></i> Reset</button>
        <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-chart-line"></i> Dashboard</a>
    </div>

    <div class="result" id="resultBox">
        <h2>📊 Your AI Speaking Evaluation</h2>
        <div class="part-breakdown">
            <div class="part-result">
                <div class="label">Part 1</div>
                <div class="value" id="part1Score">-</div>
            </div>
            <div class="part-result">
                <div class="label">Part 2</div>
                <div class="value" id="part2Score">-</div>
            </div>
            <div class="part-result">
                <div class="label">Part 3</div>
                <div class="value" id="part3Score">-</div>
            </div>
        </div>
        <div class="score-big">Overall: <span id="overallBand">-</span></div>
        <div class="feedback-text" id="feedbackText"></div>
        <div class="save-status" id="saveStatus"></div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</div>

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCV8z2TqjtwR5LpSMlGn5jCsvw1IM5vMFQ",
        authDomain: "ieltsprova.firebaseapp.com",
        projectId: "ieltsprova",
        storageBucket: "ieltsprova.firebasestorage.app",
        messagingSenderId: "812300970124",
        appId: "1:812300970124:web:992398c08c151ae97df3a9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // STATE
    // ============================================================
    let userPlan = 'free';
    let userId = null;
    let selectedPart1 = null;
    let selectedPart2 = null;
    let selectedPart3 = null;
    let part1Answers = '';
    let part2Answers = '';
    let part3Answers = '';
    let isRecording = false;
    let recognition = null;
    let userSpeech = '';
    let currentPart = 1;

    // ============================================================
    // SAMPLE TOPICS DATA
    // ============================================================
    const freeTopics = [
        { id: 1, title: "Hometown", part: "Part 1", questions: 4 },
        { id: 2, title: "Daily Routine", part: "Part 1", questions: 4 },
        { id: 3, title: "Memorable Trip", part: "Part 2", questions: 4 },
        { id: 4, title: "Travel Discussion", part: "Part 3", questions: 4 }
    ];

    const proTopics = [
        { id: 5, title: "Education System", part: "Part 1", questions: 4 },
        { id: 6, title: "Technology in Daily Life", part: "Part 1", questions: 4 },
        { id: 7, title: "Important Person", part: "Part 2", questions: 4 },
        { id: 8, title: "Health Discussion", part: "Part 3", questions: 4 },
        { id: 9, title: "Career Goals", part: "Part 1", questions: 4 },
        { id: 10, title: "Cultural Event", part: "Part 2", questions: 4 },
        { id: 11, title: "Environment Discussion", part: "Part 3", questions: 4 },
        { id: 12, title: "Leisure Activities", part: "Part 1", questions: 4 }
    ];

    const proPlusTopics = [
        { id: 13, title: "Global Issues", part: "Part 3", questions: 4 },
        { id: 14, title: "Future Plans", part: "Part 1", questions: 4 },
        { id: 15, title: "Influential Person", part: "Part 2", questions: 4 }
    ];

    // ============================================================
    // CHECK LOGIN + LOAD USER PLAN
    // ============================================================
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            document.getElementById('loginOverlay').classList.add('active');
            document.getElementById('testContent').style.display = 'none';
            return;
        }

        userId = user.uid;
        document.getElementById('loginOverlay').classList.remove('active');
        document.getElementById('testContent').style.display = 'block';

        try {
            const userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                const data = userDoc.data();
                userPlan = data.plan || 'free';
            }
        } catch (e) {
            console.log('Error loading user plan:', e);
        }

        updatePlanBadge();
        renderSections();
    });

    // ============================================================
    // UPDATE PLAN BADGE
    // ============================================================
    function updatePlanBadge() {
        const badge = document.getElementById('planBadge');
        if (userPlan === 'free') {
            badge.textContent = '🟢 Free Plan';
            badge.className = 'plan-badge';
        } else if (userPlan === 'pro') {
            badge.textContent = '⭐ Pro Plan';
            badge.className = 'plan-badge pro';
        } else {
            badge.textContent = '🚀 Pro+ Plan';
            badge.className = 'plan-badge proplus';
        }
    }

    // ============================================================
    // RENDER SECTIONS
    // ============================================================
    function renderSections() {
        const container = document.getElementById('sectionsContainer');
        
        const isPro = userPlan === 'pro' || userPlan === 'proplus';
        const isProPlus = userPlan === 'proplus';

        const totalFree = freeTopics.length;
        const totalPro = proTopics.length;
        const totalProPlus = proPlusTopics.length;

        let html = '';

        // ===== FREE SECTION =====
        html += `
            <div class="section-card">
                <div class="section-header">
                    <span class="title">🟢 Free Access</span>
                    <span class="badge free">${totalFree} Topics</span>
                </div>
                <div class="section-body">
                    <div class="topic-list">
                        ${freeTopics.map(t => `
                            <div class="topic-item">
                                <span class="t-title">🗣️ ${t.title}</span>
                                <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                                    <span class="t-part part1">${t.part}</span>
                                    <span style="font-size:0.8rem;color:#7B6A8A;">${t.questions} Qs</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn btn-primary" onclick="startTest()" style="margin-top:0.8rem;padding:0.5rem 1.5rem;font-size:0.9rem;">
                        <i class="fas fa-play"></i> Start Free Test
                    </button>
                </div>
            </div>
        `;

        // ===== PRO SECTION =====
        html += `
            <div class="section-card ${isPro ? '' : 'locked'}">
                <div class="section-header">
                    <span class="title">⭐ Pro Access</span>
                    <span class="badge pro">${isPro ? `${totalPro} Topics` : '🔒 Locked'}</span>
                </div>
                <div class="section-body">
                    ${isPro ? `
                        <div class="topic-list">
                            ${proTopics.map(t => `
                                <div class="topic-item">
                                    <span class="t-title">🗣️ ${t.title}</span>
                                    <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                                        <span class="t-part part1">${t.part}</span>
                                        <span style="font-size:0.8rem;color:#7B6A8A;">${t.questions} Qs</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="locked-overlay">
                            <span class="lock-icon">🔒</span>
                            <p style="font-weight:600;color:#4A148C;">Upgrade to Pro to unlock 50+ speaking topics</p>
                            <p style="font-size:0.85rem;color:#7B6A8A;">Get full access to all parts</p>
                            <a href="checkout.html" class="upgrade-link">⭐ Upgrade to Pro</a>
                        </div>
                    `}
                </div>
            </div>
        `;

        // ===== PRO+ SECTION =====
        html += `
            <div class="section-card ${isProPlus ? '' : 'locked'}">
                <div class="section-header">
                    <span class="title">🚀 Pro+ Access</span>
                    <span class="badge proplus">${isProPlus ? `${totalProPlus} Topics` : '🔒 Locked'}</span>
                </div>
                <div class="section-body">
                    ${isProPlus ? `
                        <div class="topic-list">
                            ${proPlusTopics.map(t => `
                                <div class="topic-item">
                                    <span class="t-title">🗣️ ${t.title}</span>
                                    <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                                        <span class="t-part part1">${t.part}</span>
                                        <span style="font-size:0.8rem;color:#7B6A8A;">${t.questions} Qs</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="locked-overlay">
                            <span class="lock-icon">🚀</span>
                            <p style="font-weight:600;color:#4A148C;">Upgrade to Pro+ to unlock 100+ speaking topics</p>
                            <p style="font-size:0.85rem;color:#7B6A8A;">Get unlimited access + AI feedback</p>
                            <a href="checkout.html" class="upgrade-link">🚀 Upgrade to Pro+</a>
                        </div>
                    `}
                </div>
            </div>
        `;

        container.innerHTML = html;
    }

    // ============================================================
    // START TEST
    // ============================================================
    function startTest() {
        const container = document.getElementById('sectionsContainer');
        
        // Find one of each part
        const part1Topic = freeTopics.find(t => t.part === "Part 1") || freeTopics[0];
        const part2Topic = freeTopics.find(t => t.part === "Part 2") || freeTopics[1];
        const part3Topic = freeTopics.find(t => t.part === "Part 3") || freeTopics[2];

        let html = `
            <div style="margin-bottom:1rem;background:#faf7ff;padding:1rem;border-radius:12px;">
                <p style="font-weight:700;color:#4A148C;">🗣️ Free Speaking Test</p>
                <p style="font-size:0.9rem;color:#7B6A8A;">Part 1, 2, 3 · 15 minutes</p>
            </div>
            <div class="ai-examiner">
                <span class="avatar">🤖</span>
                <div class="status" id="aiStatus">
                    <i class="fas fa-circle" style="color:#2e7d32; font-size:0.6rem;"></i> 
                    <span id="statusText">AI Examiner ready. Click "Start Speaking" to begin.</span>
                </div>
                <div class="transcript-box">
                    <span class="label"><i class="fas fa-comment"></i> AI Examiner says:</span>
                    <span id="aiMessage">Hello! I'm your AI IELTS examiner. Click the button below to start the test.</span>
                </div>
                <div class="transcript-box" style="border-color:#FFD700;">
                    <span class="label"><i class="fas fa-user"></i> You said:</span>
                    <span id="userMessage"><em>Your speech will appear here...</em></span>
                </div>
                <button class="mic-btn" id="micBtn" onclick="toggleRecording()">
                    <i class="fas fa-microphone"></i> Start Speaking
                </button>
                <div style="margin-top:0.5rem; font-size:0.8rem; color:#7B6A8A;">
                    <i class="fas fa-info-circle"></i> Click and speak into your microphone. AI will evaluate your fluency, vocabulary, and pronunciation.
                </div>
            </div>
        `;

        // Part 1
        html += `
            <div style="background:white;border-radius:16px;padding:1.2rem;border:1px solid #f0e8f5;margin-bottom:1rem;">
                <div style="background:#4A148C;color:white;padding:0.2rem 0.8rem;border-radius:50px;display:inline-block;font-weight:700;font-size:0.7rem;margin-bottom:0.5rem;">🗣️ Part 1</div>
                <div class="cue-card">
                    <h3 style="color:#4A148C;font-size:1rem;">🎯 Topic: ${part1Topic.title}</h3>
                    <ul class="bullets">
                        <li>Where do you live now?</li>
                        <li>What do you like about your hometown?</li>
                        <li>How often do you visit your hometown?</li>
                        <li>Would you like to live somewhere else?</li>
                    </ul>
                </div>
                <div class="speaking-area">
                    <textarea id="part1Response" placeholder="Write your Part 1 responses here..."></textarea>
                </div>
            </div>
        `;

        // Part 2
        html += `
            <div style="background:white;border-radius:16px;padding:1.2rem;border:1px solid #f0e8f5;margin-bottom:1rem;">
                <div style="background:#FFD700;color:#4A148C;padding:0.2rem 0.8rem;border-radius:50px;display:inline-block;font-weight:700;font-size:0.7rem;margin-bottom:0.5rem;">🎤 Part 2</div>
                <div class="cue-card">
                    <h3 style="color:#4A148C;font-size:1rem;">📋 Cue Card</h3>
                    <div class="topic">Describe a memorable trip you have taken.</div>
                    <p style="font-weight:600; margin:0.5rem 0;">You should say:</p>
                    <ul class="bullets">
                        <li>Where you went</li>
                        <li>Who you went with</li>
                        <li>What you did there</li>
                        <li>Why it was memorable</li>
                    </ul>
                    <div style="font-size:0.85rem; color:#7B6A8A; margin-top:0.5rem;">
                        <i class="fas fa-stopwatch"></i> Prepare for 1 minute, then speak for 2 minutes.
                    </div>
                </div>
                <div class="speaking-area">
                    <textarea id="part2Response" placeholder="Write your Part 2 speech here..."></textarea>
                </div>
            </div>
        `;

        // Part 3
        html += `
            <div style="background:white;border-radius:16px;padding:1.2rem;border:1px solid #f0e8f5;">
                <div style="background:#7B1FA2;color:white;padding:0.2rem 0.8rem;border-radius:50px;display:inline-block;font-weight:700;font-size:0.7rem;margin-bottom:0.5rem;">💬 Part 3</div>
                <div class="cue-card">
                    <h3 style="color:#4A148C;font-size:1rem;">🎯 Discussion Questions</h3>
                    <ul class="bullets">
                        <li>Why do people enjoy travelling to new places?</li>
                        <li>What are the benefits of travelling with family versus friends?</li>
                        <li>How has technology changed the way people travel?</li>
                        <li>What are the advantages and disadvantages of tourism?</li>
                    </ul>
                </div>
                <div class="speaking-area">
                    <textarea id="part3Response" placeholder="Write your Part 3 responses here..."></textarea>
                </div>
            </div>
        `;

        html += `
            <div class="actions" style="margin-top:1.5rem;">
                <button type="button" class="btn btn-success" onclick="submitTest()"><i class="fas fa-check-circle"></i> Submit & Evaluate</button>
                <button type="button" class="btn btn-secondary" onclick="resetTest()"><i class="fas fa-sync-alt"></i> Reset</button>
            </div>
        `;

        container.innerHTML = html;
        setupSpeechRecognition();
        startTimer();
    }

    // ============================================================
    // SPEECH RECOGNITION
    // ============================================================
    function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            document.getElementById('micBtn').disabled = true;
            document.getElementById('statusText').textContent = '❌ Speech recognition not supported. Please use Chrome.';
            return;
        }
    }

    function toggleRecording() {
        if (isRecording) { stopRecording(); } 
        else { startRecording(); }
    }

    function startRecording() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = true;
        recognition.interimResults = true;
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');
        const userMessage = document.getElementById('userMessage');
        micBtn.classList.add('recording');
        micBtn.innerHTML = '<i class="fas fa-stop"></i> Stop Speaking';
        isRecording = true;
        statusText.innerHTML = '<span style="color:#e53935;">🔴 Listening... Speak now!</span>';
        userMessage.textContent = '...';
        speakText("Hello! I'm your AI IELTS examiner. Let's start with Part 1.");

        recognition.onresult = function(event) {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }
            if (finalTranscript) {
                userSpeech += finalTranscript + ' ';
                userMessage.textContent = userSpeech;
                clearTimeout(recognition.timeout);
                recognition.timeout = setTimeout(() => {
                    if (isRecording) handleAIResponse(userSpeech);
                }, 2000);
            }
        };
        recognition.onerror = function(event) {
            if (event.error === 'not-allowed') alert('Please allow microphone access.');
            stopRecording();
        };
        recognition.start();
    }

    function stopRecording() {
        isRecording = false;
        const micBtn = document.getElementById('micBtn');
        micBtn.classList.remove('recording');
        micBtn.innerHTML = '<i class="fas fa-microphone"></i> Start Speaking';
        document.getElementById('statusText').innerHTML = '<span style="color:#2e7d32;">⏸️ Paused. Click "Start Speaking" to continue.</span>';
        if (recognition) recognition.stop();
    }

    function speakText(text) {
        const SpeechSynthesis = window.speechSynthesis;
        if (!SpeechSynthesis) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        utterance.lang = 'en-US';
        const voices = SpeechSynthesis.getVoices();
        const femaleVoice = voices.find(v => v.name.includes('Samantha') || v.name.includes('Google UK'));
        if (femaleVoice) utterance.voice = femaleVoice;
        document.getElementById('aiMessage').textContent = text;
        document.getElementById('statusText').innerHTML = '<span style="color:#4A148C;">🗣️ AI Examiner is speaking...</span>';
        utterance.onend = function() {
            document.getElementById('statusText').innerHTML = '<span style="color:#2e7d32;">✅ Waiting for your response...</span>';
        };
        SpeechSynthesis.speak(utterance);
    }

    if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    }

    function handleAIResponse(text) {
        const lowerText = text.toLowerCase();
        if (currentPart === 1) {
            if (lowerText.includes('live') || lowerText.includes('hometown')) {
                speakText("That's interesting! What do you usually do in your free time?");
                part1Answers += text + ' ';
                currentPart = 2;
            } else if (lowerText.includes('free time')) {
                speakText("Great! Now let's move to Part 2. Describe a memorable trip you have taken.");
                part1Answers += text + ' ';
                currentPart = 3;
                setTimeout(() => {
                    speakText("Please describe a memorable trip you have taken. Where did you go, who did you go with, what did you do, and why was it memorable?");
                }, 3000);
            } else {
                speakText("Tell me more about where you live.");
            }
        } else if (currentPart === 3) {
            if (text.length > 20) {
                part2Answers += text + ' ';
                speakText("Thank you. Now let's move to Part 3. Why do people enjoy travelling?");
                currentPart = 4;
            } else {
                speakText("Try to speak for a bit longer. Where did you go?");
            }
        } else if (currentPart === 4) {
            if (text.length > 20) {
                part3Answers += text + ' ';
                speakText("Thank you! Test complete. Click 'Submit & Evaluate'.");
                currentPart = 5;
                document.getElementById('statusText').innerHTML = '<span style="color:#2e7d32;">✅ Test complete!</span>';
            } else {
                speakText("Can you tell me more about your travel experience?");
            }
        } else {
            speakText("Test complete! Submit your answers.");
        }
        userSpeech = '';
    }

    // ============================================================
    // TIMER (15 minutes)
    // ============================================================
    let timeLeft = 900;
    let timerInterval = null;

    function startTimer() {
        const timerDisplay = document.getElementById('timerDisplay');
        timeLeft = 900;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert('⏰ Time is up!');
                stopRecording();
                submitTest();
            }
            timeLeft--;
        }, 1000);
    }

    // ============================================================
    // EVALUATE SPEAKING
    // ============================================================
    function evaluateSpeakingAI(text, part) {
        const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
        const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0).length;
        let band = 5.0;
        if (part === 1) {
            if (words >= 30) band = 7.0;
            else if (words >= 20) band = 6.5;
            else if (words >= 10) band = 6.0;
            else if (words >= 5) band = 5.5;
            else band = 5.0;
            if (sentences >= 3 && sentences <= 6) band += 0.5;
        } else if (part === 2) {
            if (words >= 150) band = 7.5;
            else if (words >= 100) band = 7.0;
            else if (words >= 60) band = 6.5;
            else if (words >= 30) band = 6.0;
            else if (words >= 15) band = 5.5;
            else band = 5.0;
            if (sentences >= 8 && sentences <= 16) band += 0.5;
        } else {
            if (words >= 80) band = 7.5;
            else if (words >= 50) band = 7.0;
            else if (words >= 30) band = 6.5;
            else if (words >= 15) band = 6.0;
            else if (words >= 8) band = 5.5;
            else band = 5.0;
            if (sentences >= 4 && sentences <= 10) band += 0.5;
        }
        band = Math.min(band, 9.0);
        band = Math.round(band * 2) / 2;
        return { band, words, sentences };
    }

    function getSpeakingFeedbackAI(p1, p2, p3) {
        const avg = (p1 + p2 + p3) / 3;
        const overall = Math.round(avg * 2) / 2;
        let feedback = '';
        let tips = [];
        if (overall >= 8.0) { feedback = '🌟 Excellent! Fluent and confident speaker.'; tips = ['Practice advanced topics', 'Use idiomatic expressions']; }
        else if (overall >= 7.0) { feedback = '👏 Great job! Capable speaker with good fluency.'; tips = ['Expand vocabulary', 'Practice longer responses']; }
        else if (overall >= 6.0) { feedback = '💪 Good effort! Solid foundation.'; tips = ['Practice variety of topics', 'Work on pronunciation']; }
        else if (overall >= 5.0) { feedback = '📚 You are making progress!'; tips = ['Practice speaking for 2 minutes', 'Listen to English daily']; }
        else { feedback = '📝 Keep practicing! Start with familiar topics.'; tips = ['Practice daily', 'Learn topic vocabulary']; }
        return { overall, feedback, tips };
    }

    // ============================================================
    // SUBMIT TEST
    // ============================================================
    async function submitTest() {
        const part1Textarea = document.getElementById('part1Response');
        const part2Textarea = document.getElementById('part2Response');
        const part3Textarea = document.getElementById('part3Response');
        
        const p1Text = part1Answers || (part1Textarea ? part1Textarea.value : 'No Part 1 response.');
        const p2Text = part2Answers || (part2Textarea ? part2Textarea.value : 'No Part 2 response.');
        const p3Text = part3Answers || (part3Textarea ? part3Textarea.value : 'No Part 3 response.');

        const result1 = evaluateSpeakingAI(p1Text, 1);
        const result2 = evaluateSpeakingAI(p2Text, 2);
        const result3 = evaluateSpeakingAI(p3Text, 3);
        const overallResult = getSpeakingFeedbackAI(result1.band, result2.band, result3.band);

        stopRecording();

        const resultBox = document.getElementById('resultBox');
        resultBox.classList.add('show');

        document.getElementById('part1Score').textContent = result1.band;
        document.getElementById('part2Score').textContent = result2.band;
        document.getElementById('part3Score').textContent = result3.band;
        document.getElementById('overallBand').textContent = overallResult.overall;

        document.getElementById('feedbackText').innerHTML = `
            <div style="margin-bottom:1rem;"><span class="band">Overall Band: ${overallResult.overall}</span></div>
            <div style="background:white;padding:1rem;border-radius:14px;margin:0.5rem 0;">
                <strong>🗣️ Part 1:</strong> Band ${result1.band} — ${result1.words} words
            </div>
            <div style="background:white;padding:1rem;border-radius:14px;margin:0.5rem 0;">
                <strong>🎤 Part 2:</strong> Band ${result2.band} — ${result2.words} words
            </div>
            <div style="background:white;padding:1rem;border-radius:14px;margin:0.5rem 0;">
                <strong>💬 Part 3:</strong> Band ${result3.band} — ${result3.words} words
            </div>
            <div style="background:#f3edf7;padding:1rem;border-radius:14px;margin:0.5rem 0;">
                <strong>📝 ${overallResult.feedback}</strong>
            </div>
            <div style="font-size:0.85rem;color:#7B6A8A;margin-top:0.5rem;">
                💡 <strong>To improve:</strong> ${overallResult.tips.map(t => `• ${t}`).join('<br />')}
            </div>
        `;

        document.querySelector('.btn-success').disabled = true;
        clearInterval(timerInterval);

        const scoreData = {
            module: 'speaking_ai',
            score: overallResult.overall,
            total: 9,
            part1: result1.band,
            part2: result2.band,
            part3: result3.band,
            date: new Date().toISOString()
        };

        let savedScores = JSON.parse(localStorage.getItem('ieltsprova_scores')) || [];
        savedScores.push(scoreData);
        localStorage.setItem('ieltsprova_scores', JSON.stringify(savedScores));

        const saveStatus = document.getElementById('saveStatus');
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    await db.collection('scores').add({
                        userId: user.uid,
                        module: 'speaking_ai',
                        score: overallResult.overall,
                        total: 9,
                        part1: result1.band,
                        part2: result2.band,
                        part3: result3.band,
                        date: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    saveStatus.innerHTML = '✅ Score saved to your account AND locally!';
                    saveStatus.style.color = '#2e7d32';
                } catch (error) {
                    saveStatus.innerHTML = '✅ Score saved locally (Firestore sync failed).';
                    saveStatus.style.color = '#f57f17';
                }
            } else {
                saveStatus.innerHTML = '✅ Score saved locally! Sign in to save to your account.';
                saveStatus.style.color = '#7B6A8A';
            }
        });
    }

    // ============================================================
    // RESET
    // ============================================================
    function resetTest() {
        stopRecording();
        clearInterval(timerInterval);
        location.reload();
    }
</script>
