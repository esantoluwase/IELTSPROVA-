<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ===== GOOGLE VERIFICATION ===== -->
    <meta name="google-site-verification" content="XOXi-f20RDZxDCBM8hRzcJSoeVBTUPBZU8luGgoW8Gw" />
    
    <title>IELTSProva — Writing Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- ===== QUESTION BANK ===== -->
    <script src="questions.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f0ff;
            color: #1a0a2e;
            padding: 2rem;
            line-height: 1.7;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 2.5rem;
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(74, 20, 140, 0.06);
            border: 1px solid #f0e8f5;
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .test-header h1 { font-size: 1.8rem; color: #4A148C; }
        .test-header h1 i { color: #7B1FA2; }
        .test-header .meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .timer-box {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
        }
        .plan-badge {
            padding: 0.3rem 1.2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .plan-badge.pro {
            background: #fff8e1;
            color: #f57f17;
        }
        .plan-badge.proplus {
            background: #fce4ec;
            color: #c62828;
        }
        
        /* ===== SECTION CARD ===== */
        .section-card {
            background: white;
            border-radius: 20px;
            border: 2px solid #f0e8f5;
            margin-bottom: 1.5rem;
            overflow: hidden;
            transition: 0.3s;
        }
        .section-card:hover {
            border-color: #7B1FA2;
        }
        .section-card.locked {
            opacity: 0.7;
            border-color: #e0d6e8;
        }
        .section-card.locked .section-header {
            background: #f5f0ff;
        }
        .section-card .section-header {
            padding: 1.2rem 1.8rem;
            background: #faf7ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .section-card .section-header .title {
            font-weight: 700;
            color: #4A148C;
            font-size: 1.1rem;
        }
        .section-card .section-header .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
        }
        .section-card .section-header .badge.free {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .section-card .section-header .badge.pro {
            background: #fff8e1;
            color: #f57f17;
        }
        .section-card .section-header .badge.proplus {
            background: #fce4ec;
            color: #c62828;
        }
        .section-card .section-body {
            padding: 1.2rem 1.8rem;
        }
        .section-card .section-body .prompt-preview {
            background: #faf7ff;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            color: #3d2a4a;
            margin-top: 0.5rem;
        }
        .section-card .section-body .locked-overlay {
            background: #f5f0ff;
            padding: 1.5rem;
            border-radius: 16px;
            text-align: center;
            border: 2px dashed #7B1FA2;
            margin-top: 0.5rem;
        }
        .section-card .section-body .locked-overlay .lock-icon {
            font-size: 2rem;
            color: #7B1FA2;
            display: block;
            margin-bottom: 0.3rem;
        }
        .section-card .section-body .locked-overlay .upgrade-link {
            display: inline-block;
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            padding: 0.5rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            margin-top: 0.5rem;
            transition: 0.3s;
        }
        .section-card .section-body .locked-overlay .upgrade-link:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(74,20,140,0.3);
        }

        .writing-area { margin-top: 0.5rem; }
        .writing-area label {
            font-weight: 600;
            color: #4A148C;
            display: block;
            margin-bottom: 0.3rem;
        }
        .writing-area textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #f0e8f5;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            min-height: 200px;
            resize: vertical;
            transition: 0.3s;
            line-height: 1.6;
        }
        .writing-area textarea:focus {
            outline: none;
            border-color: #7B1FA2;
        }
        .word-counter {
            text-align: right;
            font-size: 0.85rem;
            color: #7B6A8A;
            margin-top: 0.3rem;
        }
        .word-counter .count { font-weight: 700; color: #4A148C; }

        .actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        .btn {
            padding: 0.8rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 20, 140, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 20, 140, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #f3edf7;
            color: #4A148C;
        }
        .btn-secondary:hover { background: #e5d9ed; }
        
        .result {
            margin-top: 2rem;
            padding: 1.8rem;
            border-radius: 20px;
            background: #faf7ff;
            border: 2px solid #7B1FA2;
            display: none;
        }
        .result.show { display: block; }
        .result .score-big { font-size: 3rem; font-weight: 900; color: #4A148C; }
        .result .feedback-text { font-size: 1.05rem; margin-top: 0.5rem; line-height: 1.8; }
        .result .feedback-text .band {
            display: inline-block;
            background: #FFD700;
            color: #4A148C;
            padding: 0.2rem 1rem;
            border-radius: 50px;
            font-weight: 700;
        }
        .result .save-status { margin-top: 0.8rem; font-size: 0.95rem; }
        .result .task-breakdown {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }
        .result .task-breakdown .task-result {
            background: white;
            padding: 1rem;
            border-radius: 14px;
            border: 1px solid #f0e8f5;
            text-align: center;
        }
        .result .task-breakdown .task-result .label { font-size: 0.8rem; color: #7B6A8A; }
        .result .task-breakdown .task-result .value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #4A148C;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #4A148C;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }

        .login-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .login-overlay.active { display: flex; }
        .login-overlay .modal-box {
            background: white;
            border-radius: 32px;
            padding: 3rem;
            max-width: 440px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        .login-overlay .modal-box .icon { font-size: 4rem; display: block; margin-bottom: 0.5rem; }
        .login-overlay .modal-box h2 { color: #4A148C; font-size: 1.8rem; margin-bottom: 0.5rem; }
        .login-overlay .modal-box p { color: #7B6A8A; margin-bottom: 1.5rem; }
        .login-overlay .modal-box .btn-login {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin: 0 0.5rem;
            text-decoration: none;
            display: inline-block;
        }
        .login-overlay .modal-box .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(74,20,140,0.3);
        }
        .login-overlay .modal-box .btn-secondary {
            background: #f3edf7;
            color: #4A148C;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .login-overlay .modal-box .btn-secondary:hover { background: #e5d9ed; }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .container { padding: 1.5rem; }
            .test-header { flex-direction: column; align-items: flex-start; }
            .actions { flex-direction: column; }
            .btn { justify-content: center; }
            .result .task-breakdown { grid-template-columns: 1fr; }
            .writing-area textarea { min-height: 150px; }
            .login-overlay .modal-box { padding: 2rem; }
            .section-card .section-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<!-- ===== LOGIN OVERLAY ===== -->
<div class="login-overlay" id="loginOverlay">
    <div class="modal-box">
        <span class="icon">🔒</span>
        <h2>Login Required</h2>
        <p>You need to be logged in to take this test.</p>
        <div>
            <a href="index.html" class="btn-login"><i class="fas fa-sign-in-alt"></i> Go to Login</a>
            <a href="index.html" class="btn-secondary"><i class="fas fa-home"></i> Home</a>
        </div>
        <p style="margin-top:1rem; font-size:0.85rem; color:#7B6A8A;">
            Don't have an account? <a href="index.html" style="color:#4A148C; font-weight:600;">Sign up free</a>
        </p>
    </div>
</div>

<!-- ===== TEST CONTENT ===== -->
<div class="container" id="testContent" style="display:none;">
    <div class="test-header">
        <h1><i class="fas fa-pen-fancy"></i> Writing Test</h1>
        <div class="meta">
            <span class="timer-box"><i class="fas fa-clock"></i> <span id="timerDisplay">60:00</span></span>
            <span class="plan-badge" id="planBadge">Free</span>
        </div>
    </div>

    <div id="sectionsContainer">
        <!-- Sections will be rendered by JavaScript -->
    </div>

    <div class="actions">
        <button type="button" class="btn btn-primary" id="startTestBtn" onclick="startTest()"><i class="fas fa-play"></i> Start Free Test</button>
        <button type="button" class="btn btn-secondary" onclick="resetTest()"><i class="fas fa-sync-alt"></i> Reset</button>
        <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-chart-line"></i> Dashboard</a>
    </div>

    <div class="result" id="resultBox">
        <h2>📊 Your Writing Evaluation</h2>
        <div class="task-breakdown">
            <div class="task-result">
                <div class="label">Task 1 (Report)</div>
                <div class="value" id="task1Band">-</div>
            </div>
            <div class="task-result">
                <div class="label">Task 2 (Essay)</div>
                <div class="value" id="task2Band">-</div>
            </div>
        </div>
        <div class="score-big">Overall: <span id="overallBand">-</span></div>
        <div class="feedback-text" id="feedbackText"></div>
        <div class="save-status" id="saveStatus"></div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</div>

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCV8z2TqjtwR5LpSMlGn5jCsvw1IM5vMFQ",
        authDomain: "ieltsprova.firebaseapp.com",
        projectId: "ieltsprova",
        storageBucket: "ieltsprova.firebasestorage.app",
        messagingSenderId: "812300970124",
        appId: "1:812300970124:web:992398c08c151ae97df3a9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // STATE
    // ============================================================
    let userPlan = 'free';
    let userId = null;
    let selectedTask1 = null;
    let selectedTask2 = null;

    // ============================================================
    // CHECK LOGIN + LOAD USER PLAN
    // ============================================================
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            document.getElementById('loginOverlay').classList.add('active');
            document.getElementById('testContent').style.display = 'none';
            return;
        }

        userId = user.uid;
        document.getElementById('loginOverlay').classList.remove('active');
        document.getElementById('testContent').style.display = 'block';

        try {
            const userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                const data = userDoc.data();
                userPlan = data.plan || 'free';
            }
        } catch (e) {
            console.log('Error loading user plan:', e);
        }

        updatePlanBadge();
        renderSections();
    });

    // ============================================================
    // UPDATE PLAN BADGE
    // ============================================================
    function updatePlanBadge() {
        const badge = document.getElementById('planBadge');
        if (userPlan === 'free') {
            badge.textContent = '🟢 Free Plan';
            badge.className = 'plan-badge';
        } else if (userPlan === 'pro') {
            badge.textContent = '⭐ Pro Plan';
            badge.className = 'plan-badge pro';
        } else {
            badge.textContent = '🚀 Pro+ Plan';
            badge.className = 'plan-badge proplus';
        }
    }

    // ============================================================
    // RENDER SECTIONS
    // ============================================================
    function renderSections() {
        const container = document.getElementById('sectionsContainer');
        
        // Get writing data
        const freeTask1 = getQuestions('writing', 'free').task1 || [];
        const freeTask2 = getQuestions('writing', 'free').task2 || [];
        const proTask1 = getQuestions('writing', 'pro').task1 || [];
        const proTask2 = getQuestions('writing', 'pro').task2 || [];
        const proPlusTask1 = getQuestions('writing', 'proplus').task1 || [];
        const proPlusTask2 = getQuestions('writing', 'proplus').task2 || [];

        const isPro = userPlan === 'pro' || userPlan === 'proplus';
        const isProPlus = userPlan === 'proplus';

        let html = '';

        // ===== FREE SECTION =====
        const freeTask1Sample = freeTask1.slice(0, 1);
        const freeTask2Sample = freeTask2.slice(0, 1);
        
        html += `
            <div class="section-card">
                <div class="section-header">
                    <span class="title">🟢 Free Access</span>
                    <span class="badge free">Free — ${freeTask1.length + freeTask2.length} Prompts</span>
                </div>
                <div class="section-body">
                    <div style="font-size:0.9rem;color:#7B6A8A;margin-bottom:0.5rem;">
                        📝 Task 1: ${freeTask1.length} charts · Task 2: ${freeTask2.length} essays
                    </div>
                    <div class="prompt-preview">
                        <strong style="color:#4A148C;">Task 1:</strong> ${freeTask1Sample[0]?.title || 'No Task 1 available'}
                    </div>
                    <div class="prompt-preview" style="margin-top:0.3rem;">
                        <strong style="color:#4A148C;">Task 2:</strong> ${freeTask2Sample[0]?.title || 'No Task 2 available'}
                    </div>
                    <button class="btn btn-primary" onclick="startTest()" style="margin-top:0.5rem;padding:0.5rem 1.5rem;font-size:0.9rem;">
                        <i class="fas fa-play"></i> Start Free Test
                    </button>
                </div>
            </div>
        `;

        // ===== PRO SECTION =====
        html += `
            <div class="section-card ${isPro ? '' : 'locked'}">
                <div class="section-header">
                    <span class="title">⭐ Pro Access</span>
                    <span class="badge pro">${isPro ? `${proTask1.length + proTask2.length} Prompts` : '🔒 Locked'}</span>
                </div>
                <div class="section-body">
                    <div style="font-size:0.9rem;color:#7B6A8A;margin-bottom:0.5rem;">
                        📝 Task 1: ${proTask1.length} charts · Task 2: ${proTask2.length} essays
                    </div>
                    ${isPro ? `
                        <div class="prompt-preview">
                            <strong style="color:#4A148C;">Task 1:</strong> ${proTask1[0]?.title || 'No Task 1 available'}
                        </div>
                        <div class="prompt-preview" style="margin-top:0.3rem;">
                            <strong style="color:#4A148C;">Task 2:</strong> ${proTask2[0]?.title || 'No Task 2 available'}
                        </div>
                    ` : `
                        <div class="locked-overlay">
                            <span class="lock-icon">🔒</span>
                            <p style="font-weight:600;color:#4A148C;">Upgrade to Pro to unlock 50+ writing prompts</p>
                            <p style="font-size:0.85rem;color:#7B6A8A;">Get full access to all Task 1 & 2 prompts</p>
                            <a href="checkout.html" class="upgrade-link">⭐ Upgrade to Pro</a>
                        </div>
                    `}
                </div>
            </div>
        `;

        // ===== PRO+ SECTION =====
        html += `
            <div class="section-card ${isProPlus ? '' : 'locked'}">
                <div class="section-header">
                    <span class="title">🚀 Pro+ Access</span>
                    <span class="badge proplus">${isProPlus ? `${proPlusTask1.length + proPlusTask2.length} Prompts` : '🔒 Locked'}</span>
                </div>
                <div class="section-body">
                    <div style="font-size:0.9rem;color:#7B6A8A;margin-bottom:0.5rem;">
                        📝 Task 1: ${proPlusTask1.length} charts · Task 2: ${proPlusTask2.length} essays
                    </div>
                    ${isProPlus ? `
                        <div class="prompt-preview">
                            <strong style="color:#4A148C;">Task 1:</strong> ${proPlusTask1[0]?.title || 'No Task 1 available'}
                        </div>
                        <div class="prompt-preview" style="margin-top:0.3rem;">
                            <strong style="color:#4A148C;">Task 2:</strong> ${proPlusTask2[0]?.title || 'No Task 2 available'}
                        </div>
                    ` : `
                        <div class="locked-overlay">
                            <span class="lock-icon">🚀</span>
                            <p style="font-weight:600;color:#4A148C;">Upgrade to Pro+ to unlock 100+ writing prompts</p>
                            <p style="font-size:0.85rem;color:#7B6A8A;">Get unlimited access + AI feedback</p>
                            <a href="checkout.html" class="upgrade-link">🚀 Upgrade to Pro+</a>
                        </div>
                    `}
                </div>
            </div>
        `;

        container.innerHTML = html;
    }

    // ============================================================
    // START TEST
    // ============================================================
    function startTest() {
        const freeTask1 = getQuestions('writing', 'free').task1 || [];
        const freeTask2 = getQuestions('writing', 'free').task2 || [];

        if (freeTask1.length === 0 || freeTask2.length === 0) {
            alert('No writing prompts available. Please try again later.');
            return;
        }

        selectedTask1 = freeTask1[0];
        selectedTask2 = freeTask2[0];

        const container = document.getElementById('sectionsContainer');
        let html = `
            <div class="task-section" style="margin-bottom:2rem;padding-bottom:2rem;border-bottom:2px dashed #f0e8f5;">
                <div class="task-label" style="background:#4A148C;color:white;padding:0.3rem 1.2rem;border-radius:50px;font-weight:700;font-size:0.75rem;display:inline-block;margin-bottom:0.8rem;">📊 Task 1</div>
                <div class="task-prompt" style="background:#faf7ff;padding:1.5rem;border-radius:16px;border-left:6px solid #7B1FA2;margin-bottom:1rem;">
                    <h3 style="color:#4A148C;font-size:1.1rem;margin-bottom:0.5rem;">${selectedTask1.title || 'Chart Description'}</h3>
                    <p style="color:#3d2a4a;font-size:0.95rem;">${selectedTask1.prompt || 'Describe the chart below.'}</p>
                    <p style="font-size:0.85rem;color:#7B6A8A;margin-top:0.5rem;">📝 Minimum 150 words</p>
                </div>
                <div class="writing-area">
                    <label for="task1Response">✏️ Your response:</label>
                    <textarea id="task1Response" placeholder="Write your Task 1 response here..." oninput="updateWordCount('task1Response', 'task1Words')"></textarea>
                    <div class="word-counter">📝 Words: <span class="count" id="task1Words">0</span> / 150</div>
                </div>
            </div>
        `;

        html += `
            <div class="task-section">
                <div class="task-label" style="background:#4A148C;color:white;padding:0.3rem 1.2rem;border-radius:50px;font-weight:700;font-size:0.75rem;display:inline-block;margin-bottom:0.8rem;">📝 Task 2</div>
                <div class="task-prompt" style="background:#faf7ff;padding:1.5rem;border-radius:16px;border-left:6px solid #7B1FA2;margin-bottom:1rem;">
                    <h3 style="color:#4A148C;font-size:1.1rem;margin-bottom:0.5rem;">${selectedTask2.title || 'Essay Topic'}</h3>
                    <p style="color:#3d2a4a;font-size:0.95rem;">${selectedTask2.prompt || 'Write an essay on the topic below.'}</p>
                    <p style="font-size:0.85rem;color:#7B6A8A;margin-top:0.5rem;">📝 Minimum ${selectedTask2.minWords || 250} words</p>
                </div>
                <div class="writing-area">
                    <label for="task2Response">✏️ Your essay:</label>
                    <textarea id="task2Response" placeholder="Write your Task 2 essay here..." oninput="updateWordCount('task2Response', 'task2Words')"></textarea>
                    <div class="word-counter">📝 Words: <span class="count" id="task2Words">0</span> / ${selectedTask2.minWords || 250}</div>
                </div>
            </div>
        `;

        html += `
            <div class="actions">
                <button type="button" class="btn btn-primary" onclick="submitTest()"><i class="fas fa-check-circle"></i> Submit Test</button>
                <button type="button" class="btn btn-secondary" onclick="resetTest()"><i class="fas fa-sync-alt"></i> Reset</button>
            </div>
        `;

        container.innerHTML = html;

        // Start timer
        startTimer();
    }

    // ============================================================
    // WORD COUNTER
    // ============================================================
    function updateWordCount(textareaId, displayId) {
        const text = document.getElementById(textareaId).value;
        const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
        document.getElementById(displayId).textContent = words;
    }

    // ============================================================
    // TIMER (60 minutes)
    // ============================================================
    let timeLeft = 3600;
    let timerInterval = null;

    function startTimer() {
        const timerDisplay = document.getElementById('timerDisplay');
        timeLeft = 3600;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert('⏰ Time is up!');
                submitTest();
            }
            timeLeft--;
        }, 1000);
    }

    // ============================================================
    // EVALUATE WRITING
    // ============================================================
    function evaluateWriting(text, minWords) {
        const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
        const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0).length;
        const avgWordLength = text.length / (words || 1);
        let band = 5.0;
        
        if (words >= minWords && words <= minWords + 50) band = 6.5;
        else if (words > minWords + 50 && words <= minWords + 100) band = 7.0;
        else if (words > minWords + 100) band = 7.5;
        else if (words >= minWords - 20) band = 6.0;
        else if (words >= minWords - 50) band = 5.5;
        else if (words >= minWords - 100) band = 5.0;
        else band = 4.5;
        
        if (sentences >= 8 && sentences <= 18) band += 0.5;
        if (avgWordLength > 5 && avgWordLength < 7.5) band += 0.3;
        
        band = Math.min(band, 9.0);
        band = Math.round(band * 2) / 2;
        return { band, words, sentences };
    }

    function getFeedback(band, words, minWords) {
        const wordFeedback = words < minWords 
            ? `<br />⚠️ Needs more words (${words}/${minWords}).` 
            : `<br />✅ Good word count (${words}).`;
        if (band >= 8.5) return `🌟 Excellent work!${wordFeedback}`;
        if (band >= 7.5) return `👏 Great job! Strong writing skills.${wordFeedback}`;
        if (band >= 6.5) return `💪 Good effort! You're on the right track.${wordFeedback}`;
        if (band >= 5.5) return `📚 You're developing your skills. Keep practicing!${wordFeedback}`;
        return `📝 Keep practicing! Focus on developing your ideas.${wordFeedback}`;
    }

    // ============================================================
    // SUBMIT TEST
    // ============================================================
    async function submitTest() {
        const task1Text = document.getElementById('task1Response')?.value || '';
        const task2Text = document.getElementById('task2Response')?.value || '';

        const minWords1 = 150;
        const minWords2 = selectedTask2?.minWords || 250;

        const task1Result = evaluateWriting(task1Text, minWords1);
        const task2Result = evaluateWriting(task2Text, minWords2);

        const overallBand = Math.round(((task1Result.band + task2Result.band) / 2) * 2) / 2;

        const resultBox = document.getElementById('resultBox');
        resultBox.classList.add('show');

        document.getElementById('task1Band').textContent = task1Result.band;
        document.getElementById('task2Band').textContent = task2Result.band;
        document.getElementById('overallBand').textContent = overallBand;

        document.getElementById('feedbackText').innerHTML = `
            <div style="margin-bottom:1rem;"><span class="band">Overall Band: ${overallBand}</span></div>
            <div style="background:white;padding:1rem;border-radius:14px;margin:0.5rem 0;">
                <strong>📊 Task 1:</strong> Band ${task1Result.band} — ${getFeedback(task1Result.band, task1Result.words, minWords1)}
            </div>
            <div style="background:white;padding:1rem;border-radius:14px;margin:0.5rem 0;">
                <strong>📝 Task 2:</strong> Band ${task2Result.band} — ${getFeedback(task2Result.band, task2Result.words, minWords2)}
            </div>
        `;

        document.querySelector('.btn-primary').disabled = true;
        clearInterval(timerInterval);

        const scoreData = {
            module: 'writing',
            score: overallBand,
            total: 9,
            task1Band: task1Result.band,
            task2Band: task2Result.band,
            date: new Date().toISOString()
        };

        let savedScores = JSON.parse(localStorage.getItem('ieltsprova_scores')) || [];
        savedScores.push(scoreData);
        localStorage.setItem('ieltsprova_scores', JSON.stringify(savedScores));

        const saveStatus = document.getElementById('saveStatus');
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    await db.collection('scores').add({
                        userId: user.uid,
                        module: 'writing',
                        score: overallBand,
                        total: 9,
                        task1Band: task1Result.band,
                        task2Band: task2Result.band,
                        date: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    saveStatus.innerHTML = '✅ Score saved to your account AND locally!';
                    saveStatus.style.color = '#2e7d32';
                } catch (error) {
                    saveStatus.innerHTML = '✅ Score saved locally (Firestore sync failed).';
                    saveStatus.style.color = '#f57f17';
                }
            } else {
                saveStatus.innerHTML = '✅ Score saved locally! Sign in to save to your account.';
                saveStatus.style.color = '#7B6A8A';
            }
        });
    }

    // ============================================================
    // RESET
    // ============================================================
    function resetTest() {
        clearInterval(timerInterval);
        location.reload();
    }
</script>
