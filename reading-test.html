<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ===== GOOGLE VERIFICATION ===== -->
    <meta name="google-site-verification" content="XOXi-f20RDZxDCBM8hRzcJSoeVBTUPBZU8luGgoW8Gw" />
    
    <title>IELTSProva — Reading Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- ===== QUESTION BANK ===== -->
    <script src="questions.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f0ff;
            color: #1a0a2e;
            padding: 2rem;
            line-height: 1.7;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 2.5rem;
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(74, 20, 140, 0.06);
            border: 1px solid #f0e8f5;
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .test-header h1 { font-size: 1.8rem; color: #4A148C; }
        .test-header h1 i { color: #7B1FA2; }
        .test-header .meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .timer-box {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
        }
        .plan-badge {
            padding: 0.3rem 1.2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .plan-badge.pro {
            background: #fff8e1;
            color: #f57f17;
        }
        .progress-indicator {
            background: #f3edf7;
            padding: 0.8rem 1.2rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .progress-indicator .bar {
            flex: 1;
            height: 6px;
            background: #ddd;
            border-radius: 50px;
            overflow: hidden;
            min-width: 100px;
        }
        .progress-indicator .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4A148C, #7B1FA2);
            border-radius: 50px;
            width: 0%;
            transition: width 0.5s ease;
        }
        .passage {
            background: #faf7ff;
            padding: 1.8rem;
            border-radius: 18px;
            margin-bottom: 2rem;
            border-left: 6px solid #7B1FA2;
        }
        .passage h2 { color: #4A148C; font-size: 1.2rem; margin-bottom: 0.5rem; }
        .passage p { margin-bottom: 1rem; font-size: 1rem; }
        .question {
            background: white;
            padding: 1.5rem 1.8rem;
            margin-bottom: 1.2rem;
            border-radius: 16px;
            border: 1px solid #f0e8f5;
            transition: 0.2s;
        }
        .question:hover { border-color: #7B1FA2; }
        .question .q-number { font-weight: 700; color: #4A148C; margin-bottom: 0.3rem; }
        .question label {
            display: block;
            padding: 0.3rem 0;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .question label input {
            margin-right: 0.7rem;
            transform: scale(1.1);
            accent-color: #7B1FA2;
        }
        .actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        .btn {
            padding: 0.8rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 20, 140, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 20, 140, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #f3edf7;
            color: #4A148C;
        }
        .btn-secondary:hover { background: #e5d9ed; }
        .result {
            margin-top: 2rem;
            padding: 1.8rem;
            border-radius: 20px;
            background: #faf7ff;
            border: 2px solid #7B1FA2;
            display: none;
        }
        .result.show { display: block; }
        .result .score-big {
            font-size: 3.5rem;
            font-weight: 900;
            color: #4A148C;
        }
        .result .feedback-text { font-size: 1.1rem; margin-top: 0.5rem; }
        .result .save-status { margin-top: 0.8rem; font-size: 0.95rem; }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #4A148C;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }

        .login-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .login-overlay.active { display: flex; }
        .login-overlay .modal-box {
            background: white;
            border-radius: 32px;
            padding: 3rem;
            max-width: 440px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        .login-overlay .modal-box .icon { font-size: 4rem; display: block; margin-bottom: 0.5rem; }
        .login-overlay .modal-box h2 { color: #4A148C; font-size: 1.8rem; margin-bottom: 0.5rem; }
        .login-overlay .modal-box p { color: #7B6A8A; margin-bottom: 1.5rem; }
        .login-overlay .modal-box .btn-login {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin: 0 0.5rem;
            text-decoration: none;
            display: inline-block;
        }
        .login-overlay .modal-box .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(74, 20, 140, 0.3);
        }
        .login-overlay .modal-box .btn-secondary {
            background: #f3edf7;
            color: #4A148C;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .login-overlay .modal-box .btn-secondary:hover { background: #e5d9ed; }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .question-limit-info {
            background: #faf7ff;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid #f0e8f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .question-limit-info .free-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
        }
        .question-limit-info .pro-badge {
            background: #FFD700;
            color: #4A148C;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
        }
        .question-limit-info .upgrade-link {
            color: #4A148C;
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .container { padding: 1.5rem; }
            .test-header { flex-direction: column; align-items: flex-start; }
            .question { padding: 1rem; }
            .actions { flex-direction: column; }
            .btn { justify-content: center; }
            .login-overlay .modal-box { padding: 2rem; }
        }
    </style>
</head>
<body>

<!-- ===== LOGIN OVERLAY ===== -->
<div class="login-overlay" id="loginOverlay">
    <div class="modal-box">
        <span class="icon">🔒</span>
        <h2>Login Required</h2>
        <p>You need to be logged in to take this test.</p>
        <div>
            <a href="index.html" class="btn-login"><i class="fas fa-sign-in-alt"></i> Go to Login</a>
            <a href="index.html" class="btn-secondary"><i class="fas fa-home"></i> Home</a>
        </div>
        <p style="margin-top:1rem; font-size:0.85rem; color:#7B6A8A;">
            Don't have an account? <a href="index.html" style="color:#4A148C; font-weight:600;">Sign up free</a>
        </p>
    </div>
</div>

<!-- ===== TEST CONTENT ===== -->
<div class="container" id="testContent" style="display:none;">
    <div class="test-header">
        <h1><i class="fas fa-book-open"></i> Reading Test</h1>
        <div class="meta">
            <span class="timer-box"><i class="fas fa-clock"></i> <span id="timerDisplay">15:00</span></span>
            <span class="plan-badge" id="planBadge">Loading...</span>
        </div>
    </div>

    <!-- ===== QUESTION LIMIT INFO ===== -->
    <div class="question-limit-info" id="questionLimitInfo">
        <span id="limitText">Loading question limit...</span>
        <span>
            <span class="free-badge" id="freeBadge">Free: 100 Qs</span>
            <span class="pro-badge" id="proBadge" style="display:none;">⭐ Pro: Unlimited</span>
            <a href="checkout.html" class="upgrade-link" id="upgradeLink" style="display:none;">Upgrade →</a>
        </span>
    </div>

    <div class="progress-indicator">
        <span id="progressText">Question 0 of 0</span>
        <div class="bar"><div class="fill" id="progressFill"></div></div>
    </div>

    <div id="passageContainer"></div>
    <form id="testForm"></form>

    <div class="actions">
        <button type="button" class="btn btn-primary" onclick="submitTest()"><i class="fas fa-check-circle"></i> Submit Test</button>
        <button type="button" class="btn btn-secondary" onclick="resetTest()"><i class="fas fa-sync-alt"></i> New Test</button>
        <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-chart-line"></i> Dashboard</a>
    </div>

    <div class="result" id="resultBox">
        <h2>📊 Your Score</h2>
        <div class="score-big"><span id="scoreDisplay">0</span> / <span id="totalQuestions">0</span></div>
        <div class="feedback-text" id="feedbackText"></div>
        <div class="save-status" id="saveStatus"></div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</div>

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCV8z2TqjtwR5LpSMlGn5jCsvw1IM5vMFQ",
        authDomain: "ieltsprova.firebaseapp.com",
        projectId: "ieltsprova",
        storageBucket: "ieltsprova.firebasestorage.app",
        messagingSenderId: "812300970124",
        appId: "1:812300970124:web:992398c08c151ae97df3a9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // STATE
    // ============================================================
    let userPlan = 'free';
    let userId = null;
    let selectedQuestions = [];
    let answers = {};

    // ============================================================
    // 🔒 CHECK LOGIN + LOAD USER PLAN
    // ============================================================
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            document.getElementById('loginOverlay').classList.add('active');
            document.getElementById('testContent').style.display = 'none';
            return;
        }

        userId = user.uid;
        document.getElementById('loginOverlay').classList.remove('active');
        document.getElementById('testContent').style.display = 'block';

        // Load user's plan from Firestore
        try {
            const userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                const data = userDoc.data();
                userPlan = data.plan || 'free';
            }
        } catch (e) {
            console.log('Error loading user plan:', e);
        }

        // Update UI based on plan
        updatePlanUI();
        renderTest();
    });

    // ============================================================
    // UPDATE PLAN UI
    // ============================================================
    function updatePlanUI() {
        const planBadge = document.getElementById('planBadge');
        const limitText = document.getElementById('limitText');
        const freeBadge = document.getElementById('freeBadge');
        const proBadge = document.getElementById('proBadge');
        const upgradeLink = document.getElementById('upgradeLink');

        if (userPlan === 'free') {
            planBadge.textContent = 'Free — 100 Qs';
            planBadge.className = 'plan-badge';
            limitText.textContent = '📚 You have access to 100 free questions.';
            freeBadge.style.display = 'inline-block';
            proBadge.style.display = 'none';
            upgradeLink.style.display = 'inline-block';
            upgradeLink.textContent = '🚀 Upgrade for Unlimited →';
        } else {
            planBadge.textContent = '⭐ Pro — Unlimited Qs';
            planBadge.className = 'plan-badge pro';
            limitText.textContent = '🌟 You have unlimited access to all questions!';
            freeBadge.style.display = 'none';
            proBadge.style.display = 'inline-block';
            upgradeLink.style.display = 'none';
        }
    }

    // ============================================================
    // RENDER TEST
    // ============================================================
    function renderTest() {
        // Get questions from the question bank
        const allQuestions = getQuestions('reading', userPlan);
        
        // Shuffle and select based on plan
        const shuffled = shuffleArray([...allQuestions]);
        const limit = userPlan === 'free' ? Math.min(10, shuffled.length) : Math.min(40, shuffled.length);
        selectedQuestions = shuffled.slice(0, limit);

        // Build answer key
        answers = {};
        selectedQuestions.forEach(q => {
            answers[`q${q.id}`] = q.answer;
        });

        const container = document.getElementById('testForm');
        const passageContainer = document.getElementById('passageContainer');
        const totalSpan = document.getElementById('totalQuestions');

        totalSpan.textContent = selectedQuestions.length;

        // Show passage if available
        if (selectedQuestions.length > 0 && selectedQuestions[0].passage) {
            passageContainer.innerHTML = `
                <div class="passage">
                    <h2>📄 ${selectedQuestions[0].title || 'Reading Passage'}</h2>
                    <p>${selectedQuestions[0].passage}</p>
                </div>
            `;
        } else {
            passageContainer.innerHTML = '';
        }

        // Build questions
        let html = '';
        selectedQuestions.forEach((q, index) => {
            const qNum = index + 1;
            const labels = ['A', 'B', 'C', 'D'];
            html += `<div class="question" data-index="${index}">
                <div class="q-number">Question ${qNum}</div>
                <p>${q.text}</p>`;
            q.options.forEach((opt, i) => {
                html += `<label>
                    <input type="radio" name="q${q.id}" value="${labels[i]}" onchange="updateProgress()" />
                    ${labels[i]}) ${opt}
                </label>`;
            });
            html += `</div>`;
        });

        container.innerHTML = html;
        updateProgress();
    }

    // ============================================================
    // UPDATE PROGRESS
    // ============================================================
    function updateProgress() {
        const total = selectedQuestions.length;
        let answered = 0;
        selectedQuestions.forEach(q => {
            const checked = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (checked) answered++;
        });
        document.getElementById('progressText').textContent = `Question ${answered} of ${total}`;
        document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
    }

    // ============================================================
    // TIMER
    // ============================================================
    let timeLeft = 900;
    const timerDisplay = document.getElementById('timerDisplay');

    function updateTimer() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert('⏰ Time is up! Your test will be submitted automatically.');
            submitTest();
        }
        timeLeft--;
    }

    const timerInterval = setInterval(updateTimer, 1000);
    updateTimer();

    // ============================================================
    // SUBMIT TEST
    // ============================================================
    async function submitTest() {
        let score = 0;
        const total = selectedQuestions.length;

        selectedQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (selected && selected.value === q.answer) {
                score++;
            }
        });

        const resultBox = document.getElementById('resultBox');
        resultBox.classList.add('show');

        document.getElementById('scoreDisplay').textContent = score;

        const feedback = document.getElementById('feedbackText');
        const percentage = (score / total) * 100;
        if (percentage === 100) {
            feedback.innerHTML = '🌟 Perfect score! You\'re ready for the real IELTS!';
        } else if (percentage >= 80) {
            feedback.innerHTML = '👏 Great job! You\'re well on your way to a high band.';
        } else if (percentage >= 60) {
            feedback.innerHTML = '💪 Good effort! Review the passage and try again.';
        } else {
            feedback.innerHTML = '📚 Keep practicing! Read the passage more carefully and try again.';
        }

        document.querySelectorAll('input').forEach(input => input.disabled = true);
        document.querySelector('.btn-primary').disabled = true;
        clearInterval(timerInterval);

        // Save score
        const scoreData = {
            module: 'reading',
            score: score,
            total: total,
            date: new Date().toISOString()
        };

        let savedScores = JSON.parse(localStorage.getItem('ieltsprova_scores')) || [];
        savedScores.push(scoreData);
        localStorage.setItem('ieltsprova_scores', JSON.stringify(savedScores));

        const saveStatus = document.getElementById('saveStatus');

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    await db.collection('scores').add({
                        userId: user.uid,
                        module: 'reading',
                        score: score,
                        total: total,
                        date: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    saveStatus.innerHTML = '✅ Score saved to your account AND locally!';
                    saveStatus.style.color = '#2e7d32';
                } catch (error) {
                    saveStatus.innerHTML = '✅ Score saved locally (Firestore sync failed, but your data is safe!)';
                    saveStatus.style.color = '#f57f17';
                }
            } else {
                saveStatus.innerHTML = '✅ Score saved locally! Sign in to save to your account.';
                saveStatus.style.color = '#7B6A8A';
            }
        });
    }

    // ============================================================
    // RESET
    // ============================================================
    function resetTest() {
        location.reload();
    }

    // ============================================================
    // SHUFFLE HELPER
    // ============================================================
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }
</script>

</body>
    </html>
