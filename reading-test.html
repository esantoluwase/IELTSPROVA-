    // ============================================================

    const PLAN = 'free';

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    let allQuestions = [];
    questionBank.forEach(passage => {
        passage.questions.forEach(q => {
            allQuestions.push({
                ...q,
                passageText: passage.passage
            });
        });
    });

    const shuffledQuestions = shuffle(allQuestions);
    const limit = PLAN === 'free' ? 10 : allQuestions.length;
    const selectedQuestions = shuffledQuestions.slice(0, limit);

    const answers = {};
    selectedQuestions.forEach(q => {
        answers[`q${q.id}`] = q.answer;
    });

    function renderTest() {
        const container = document.getElementById('testForm');
        const passageContainer = document.getElementById('passageContainer');
        const planBadge = document.getElementById('planBadge');
        const totalSpan = document.getElementById('totalQuestions');

        if (PLAN === 'free') {
            planBadge.textContent = 'Free — 10 Questions';
            planBadge.className = 'plan-badge';
        } else {
            planBadge.textContent = 'Pro — All 60 Questions';
            planBadge.className = 'plan-badge pro';
        }

        totalSpan.textContent = selectedQuestions.length;

        if (selectedQuestions.length > 0) {
            const first = selectedQuestions[0];
            passageContainer.innerHTML = `
                <div class="passage">
                    <h2>📄 Reading Passage</h2>
                    <p>${first.passageText}</p>
                </div>
            `;
        }

        let html = '';
        selectedQuestions.forEach((q, index) => {
            const qNum = index + 1;
            const labels = ['A', 'B', 'C', 'D'];
            html += `<div class="question" data-index="${index}">
                <div class="q-number">Question ${qNum}</div>
                <p>${q.text}</p>`;
            q.options.forEach((opt, i) => {
                html += `<label>
                    <input type="radio" name="q${q.id}" value="${labels[i]}" onchange="updateProgress()" />
                    ${labels[i]}) ${opt}
                </label>`;
            });
            html += `</div>`;
        });

        container.innerHTML = html;
        updateProgress();
    }

    function updateProgress() {
        const total = selectedQuestions.length;
        let answered = 0;
        selectedQuestions.forEach(q => {
            const checked = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (checked) answered++;
        });
        document.getElementById('progressText').textContent = `Question ${answered} of ${total}`;
        document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
    }

    renderTest();

        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert('⏰ Time is up! Your test will be submitted automatically.');
            submitTest();
        }
        timeLeft--;
    }

    const timerInterval = setInterval(updateTimer, 1000);
    updateTimer();

    // ============================================================
    // SUBMIT TEST — SAVES TO LOCALSTORAGE + FIRESTORE
    // ============================================================
    async function submitTest() {
        let score = 0;
        const total = selectedQuestions.length;

        selectedQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (selected && selected.value === q.answer) {
                score++;
            }
        });

        const resultBox = document.getElementById('resultBox');
        resultBox.classList.add('show');

        document.getElementById('scoreDisplay').textContent = score;

        const feedback = document.getElementById('feedbackText');
        const percentage = (score / total) * 100;
        if (percentage === 100) {
            feedback.innerHTML = '🌟 Perfect score! You\'re ready for the real IELTS!';
        } else if (percentage >= 80) {
            feedback.innerHTML = '👏 Great job! You\'re well on your way to a high band.';
        } else if (percentage >= 60) {
            feedback.innerHTML = '💪 Good effort! Review the passage and try again.';
        } else {
            feedback.innerHTML = '📚 Keep practicing! Read the passage more carefully and try again.';
        }

        document.querySelectorAll('input').forEach(input => input.disabled = true);
        document.querySelector('.btn-primary').disabled = true;
        clearInterval(timerInterval);

        // ============================================================
        // SAVE TO LOCALSTORAGE (ALWAYS WORKS)
        // ============================================================
        const scoreData = {
            module: 'reading',
            score: score,
            total: total,
            date: new Date().toISOString()
        };

        // Get existing scores from localStorage
        let savedScores = JSON.parse(localStorage.getItem('ieltsprova_scores')) || [];
        savedScores.push(scoreData);
        localStorage.setItem('ieltsprova_scores', JSON.stringify(savedScores));

        console.log('✅ Score saved to localStorage:', scoreData);
        console.log('📊 All saved scores:', savedScores);

        // ============================================================
        // ALSO TRY TO SAVE TO FIRESTORE
        // ============================================================
        const saveStatus = document.getElementById('saveStatus');

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    await db.collection('scores').add({
                        userId: user.uid,
                        module: 'reading',
                        score: score,
                        total: total,
                        date: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    saveStatus.innerHTML = '✅ Score saved to your account AND locally!';
                    saveStatus.style.color = '#2e7d32';
                } catch (error) {
                    console.error('❌ Firestore error:', error);
                    saveStatus.innerHTML = '✅ Score saved locally (Firestore sync failed, but your data is safe!)';
                    saveStatus.style.color = '#f57f17';
                }
            } else {
                saveStatus.innerHTML = '✅ Score saved locally! Sign in to save to your account.';
                saveStatus.style.color = '#7B6A8A';
            }
        });
    }

    // ============================================================
    // RESET TEST
    // ============================================================
    function resetTest() {
        location.reload();
    }
</script>
