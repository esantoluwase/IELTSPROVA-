        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {

            padding: 2rem;

        .container {

        .timer-box {

        .login-overlay .modal-box .btn-login {
            background: linear-gradient(135deg, #4A148C, #7B1FA2);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin: 0 0.5rem;
            text-decoration: none;
            display: inline-block;
        }
        .login-overlay .modal-box .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(74,20,140,0.3);
        }
        .login-overlay .modal-box .btn-secondary {
            background: #f3edf7;
            color: #4A148C;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .login-overlay .modal-box .btn-secondary:hover { background: #e5d9ed; }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .question-item {
            background: #faf7ff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 0.8rem;
            border-left: 4px solid #7B1FA2;
        }
        .question-item .q-number {
            font-weight: 700;
            color: #4A148C;
            font-size: 0.85rem;
        }
        .question-item .q-text {
            font-size: 0.95rem;
            color: #3d2a4a;
            margin-top: 0.2rem;
        }
        .question-item label {
            display: block;
            padding: 0.2rem 0;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .question-item label input {
            margin-right: 0.5rem;
            accent-color: #7B1FA2;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .container { padding: 1.5rem; }
            .test-header { flex-direction: column; align-items: flex-start; }
            .section-card .section-header { flex-direction: column; align-items: flex-start; }
            .actions { flex-direction: column; }
            .btn { justify-content: center; }
            .login-overlay .modal-box { padding: 2rem; }
            .section-card .section-body .passage-item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<!-- ===== LOGIN OVERLAY ===== -->
<div class="login-overlay" id="loginOverlay">
    <div class="modal-box">
        <span class="icon">🔒</span>
        <h2>Login Required</h2>
        <p>You need to be logged in to take this test.</p>
        <div>
            <a href="index.html" class="btn-login"><i class="fas fa-sign-in-alt"></i> Go to Login</a>
            <a href="index.html" class="btn-secondary"><i class="fas fa-home"></i> Home</a>
        </div>
        <p style="margin-top:1rem; font-size:0.85rem; color:#7B6A8A;">
            Don't have an account? <a href="index.html" style="color:#4A148C; font-weight:600;">Sign up free</a>
        </p>
    </div>
</div>

<!-- ===== TEST CONTENT ===== -->
<div class="container" id="testContent" style="display:none;">
    <div class="test-header">
        <h1><i class="fas fa-book-open"></i> Reading Test</h1>
        <div class="meta">
            <span class="timer-box"><i class="fas fa-clock"></i> <span id="timerDisplay">15:00</span></span>
            <span class="plan-badge" id="planBadge">Free</span>
        </div>
    </div>

    <div id="sectionsContainer">
        <!-- Sections will be rendered by JavaScript -->
    </div>

    <div class="actions">
        <button type="button" class="btn btn-primary" id="startTestBtn" onclick="startTest()"><i class="fas fa-play"></i> Start Free Test</button>
        <button type="button" class="btn btn-secondary" onclick="resetTest()"><i class="fas fa-sync-alt"></i> Reset</button>
        <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-chart-line"></i> Dashboard</a>
    </div>

    <div class="result" id="resultBox">
        <h2>📊 Your Score</h2>
        <div class="score-big"><span id="scoreDisplay">0</span> / <span id="totalQuestions">0</span></div>
        <div class="feedback-text" id="feedbackText"></div>
        <div class="save-status" id="saveStatus"></div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</div>

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCV8z2TqjtwR5LpSMlGn5jCsvw1IM5vMFQ",
        authDomain: "ieltsprova.firebaseapp.com",
        projectId: "ieltsprova",
        storageBucket: "ieltsprova.firebasestorage.app",
        messagingSenderId: "812300970124",
        appId: "1:812300970124:web:992398c08c151ae97df3a9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // STATE
    // ============================================================
    let userPlan = 'free';
    let userId = null;
    let selectedQuestions = [];
    let answers = {};

    // ============================================================
    // SAMPLE PASSAGES DATA
    // ============================================================
    const freePassages = [
        { id: 1, title: "The History of Glassmaking", level: "Easy", questions: 20 }
    ];

    const proPassages = [
        { id: 2, title: "The Science of Sleep", level: "Medium", questions: 20 },
        { id: 3, title: "Renewable Energy", level: "Medium", questions: 20 },
        { id: 4, title: "Cultural Heritage", level: "Medium", questions: 20 },
        { id: 5, title: "Artificial Intelligence", level: "Hard", questions: 20 },
        { id: 6, title: "Environmental Conservation", level: "Hard", questions: 20 }
    ];

    const proPlusPassages = [
        { id: 7, title: "Space Exploration", level: "Hard", questions: 20 },
        { id: 8, title: "Genetics and Health", level: "Hard", questions: 20 },
        { id: 9, title: "Global Economy", level: "Hard", questions: 20 },
        { id: 10, title: "Urbanization", level: "Hard", questions: 20 }
    ];

    // ============================================================
    // CHECK LOGIN + LOAD USER PLAN
    // ============================================================
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            document.getElementById('loginOverlay').classList.add('active');
            document.getElementById('testContent').style.display = 'none';
            return;
        }

        userId = user.uid;
        document.getElementById('loginOverlay').classList.remove('active');
        document.getElementById('testContent').style.display = 'block';

        try {
            const userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                const data = userDoc.data();
                userPlan = data.plan || 'free';
            }
        } catch (e) {
            console.log('Error loading user plan:', e);
        }

        updatePlanBadge();
        renderSections();
    });

    // ============================================================
    // UPDATE PLAN BADGE
    // ============================================================
    function updatePlanBadge() {
        const badge = document.getElementById('planBadge');
        if (userPlan === 'free') {
            badge.textContent = '🟢 Free Plan';
            badge.className = 'plan-badge';
        } else if (userPlan === 'pro') {
            badge.textContent = '⭐ Pro Plan';
            badge.className = 'plan-badge pro';
        } else {
            badge.textContent = '🚀 Pro+ Plan';
            badge.className = 'plan-badge proplus';
        }
    }

    // ============================================================
    // RENDER SECTIONS
    // ============================================================
    function renderSections() {
        const container = document.getElementById('sectionsContainer');
        
        const isPro = userPlan === 'pro' || userPlan === 'proplus';
        const isProPlus = userPlan === 'proplus';

        let html = '';

        // ===== FREE SECTION =====
        html += `
            <div class="section-card">
                <div class="section-header">
                    <span class="title">🟢 Free Access</span>
                    <span class="badge free">${freePassages.length} Passages · ${freePassages.length * 20} Questions</span>
                </div>
                <div class="section-body">
                    <div class="question-count">
                        📊 <span class="available">${freePassages.length}</span> passages available for free
                    </div>
                    <div class="passage-list">
                        ${freePassages.map(p => `
                            <div class="passage-item">
                                <span class="p-title">${p.title}</span>
                                <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                                    <span class="p-level ${p.level.toLowerCase()}">${p.level}</span>
                                    <span class="p-questions">${p.questions} Questions</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn btn-primary" onclick="startTest()" style="margin-top:0.8rem;padding:0.5rem 1.5rem;font-size:0.9rem;">
                        <i class="fas fa-play"></i> Start Free Test
                    </button>
                </div>
            </div>
        `;

        // ===== PRO SECTION =====
        html += `
            <div class="section-card ${isPro ? '' : 'locked'}">
                <div class="section-header">
                    <span class="title">⭐ Pro Access</span>
                    <span class="badge pro">${isPro ? `${proPassages.length} Passages · ${proPassages.length * 20} Questions` : '🔒 Locked'}</span>
                </div>
                <div class="section-body">
                    <div class="question-count">
                        📊 <span class="${isPro ? 'available' : 'locked'}">${isPro ? proPassages.length : '🔒'}</span> pro passages available
                    </div>
                    ${isPro ? `
                        <div class="passage-list">
                            ${proPassages.map(p => `
                                <div class="passage-item">
                                    <span class="p-title">${p.title}</span>
                                    <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                                        <span class="p-level ${p.level.toLowerCase()}">${p.level}</span>
                                        <span class="p-questions">${p.questions} Questions</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="locked-overlay">
                            <span class="lock-icon">🔒</span>
                            <p style="font-weight:600;color:#4A148C;">Upgrade to Pro to unlock 50+ reading passages</p>
                            <p style="font-size:0.85rem;color:#7B6A8A;">Get full access to all reading passages</p>
                            <a href="checkout.html" class="upgrade-link">⭐ Upgrade to Pro</a>
                        </div>
                    `}
                </div>
            </div>
        `;

        // ===== PRO+ SECTION =====
        html += `
            <div class="section-card ${isProPlus ? '' : 'locked'}">
                <div class="section-header">
                    <span class="title">🚀 Pro+ Access</span>
                    <span class="badge proplus">${isProPlus ? `${proPlusPassages.length} Passages · ${proPlusPassages.length * 20} Questions` : '🔒 Locked'}</span>
                </div>
                <div class="section-body">
                    <div class="question-count">
                        📊 <span class="${isProPlus ? 'available' : 'locked'}">${isProPlus ? proPlusPassages.length : '🔒'}</span> pro+ passages available
                    </div>
                    ${isProPlus ? `
                        <div class="passage-list">
                            ${proPlusPassages.map(p => `
                                <div class="passage-item">
                                    <span class="p-title">${p.title}</span>
                                    <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                                        <span class="p-level ${p.level.toLowerCase()}">${p.level}</span>
                                        <span class="p-questions">${p.questions} Questions</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="locked-overlay">
                            <span class="lock-icon">🚀</span>
                            <p style="font-weight:600;color:#4A148C;">Upgrade to Pro+ to unlock 100+ reading passages</p>
                            <p style="font-size:0.85rem;color:#7B6A8A;">Get unlimited access + AI feedback</p>
                            <a href="checkout.html" class="upgrade-link">🚀 Upgrade to Pro+</a>
                        </div>
                    `}
                </div>
            </div>
        `;

        container.innerHTML = html;
    }

    // ============================================================
    // START TEST
    // ============================================================
    function startTest() {
        // Generate sample questions for the free passage
        const sampleQuestions = [];
        const passage = freePassages[0];
        
        for (let i = 1; i <= 20; i++) {
            sampleQuestions.push({
                id: i,
                text: `Sample question ${i} for "${passage.title}"`,
                options: ["A) Option 1", "B) Option 2", "C) Option 3", "D) Option 4"],
                answer: "A"
            });
        }

        selectedQuestions = shuffleArray(sampleQuestions);

        answers = {};
        selectedQuestions.forEach(q => {
            answers[`q${q.id}`] = q.answer;
        });

        const container = document.getElementById('sectionsContainer');
        let html = `
            <div style="margin-bottom:1rem;background:#faf7ff;padding:1rem;border-radius:12px;">
                <p style="font-weight:700;color:#4A148C;">📄 ${passage.title}</p>
                <p style="font-size:0.9rem;color:#7B6A8A;">${selectedQuestions.length} questions · ${passage.level} level</p>
            </div>
        `;

        selectedQuestions.forEach((q, index) => {
            const qNum = index + 1;
            const labels = ['A', 'B', 'C', 'D'];
            html += `
                <div class="question-item">
                    <div class="q-number">Question ${qNum}</div>
                    <div class="q-text">${q.text}</div>
                    <div style="margin-top:0.3rem;">
                        ${q.options.map((opt, i) => `
                            <label>
                                <input type="radio" name="q${q.id}" value="${labels[i]}" />
                                ${opt}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
        });

        html += `
            <div class="actions">
                <button type="button" class="btn btn-primary" onclick="submitTest()"><i class="fas fa-check-circle"></i> Submit Test</button>
                <button type="button" class="btn btn-secondary" onclick="resetTest()"><i class="fas fa-sync-alt"></i> Reset</button>
            </div>
        `;

        container.innerHTML = html;
        startTimer();
    }

    // ============================================================
    // TIMER
    // ============================================================
    let timeLeft = 900;
    let timerInterval = null;

    function startTimer() {
        const timerDisplay = document.getElementById('timerDisplay');
        timeLeft = 900;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert('⏰ Time is up!');
                submitTest();
            }
            timeLeft--;
        }, 1000);
    }

    // ============================================================
    // SUBMIT TEST
    // ============================================================
    async function submitTest() {
        let score = 0;
        const total = selectedQuestions.length;

        selectedQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (selected && selected.value === q.answer) {
                score++;
            }
        });

        const resultBox = document.getElementById('resultBox');
        resultBox.classList.add('show');
        document.getElementById('scoreDisplay').textContent = score;
        document.getElementById('totalQuestions').textContent = total;

        const feedback = document.getElementById('feedbackText');
        const percentage = (score / total) * 100;
        if (percentage === 100) {
            feedback.innerHTML = '🌟 Perfect score! You\'re ready for the real IELTS!';
        } else if (percentage >= 80) {
            feedback.innerHTML = '👏 Great job! You\'re well on your way to a high band.';
        } else if (percentage >= 60) {
            feedback.innerHTML = '💪 Good effort! Review the passage and try again.';
        } else {
            feedback.innerHTML = '📚 Keep practicing! Read the passage more carefully and try again.';
        }

        document.querySelectorAll('input').forEach(input => input.disabled = true);
        clearInterval(timerInterval);

        const scoreData = {
            module: 'reading',
            score: score,
            total: total,
            date: new Date().toISOString()
        };

        let savedScores = JSON.parse(localStorage.getItem('ieltsprova_scores')) || [];
        savedScores.push(scoreData);
        localStorage.setItem('ieltsprova_scores', JSON.stringify(savedScores));

        const saveStatus = document.getElementById('saveStatus');
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    await db.collection('scores').add({
                        userId: user.uid,
                        module: 'reading',
                        score: score,
                        total: total,
                        date: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    saveStatus.innerHTML = '✅ Score saved to your account AND locally!';
                    saveStatus.style.color = '#2e7d32';
                } catch (error) {
                    saveStatus.innerHTML = '✅ Score saved locally (Firestore sync failed).';
                    saveStatus.style.color = '#f57f17';
                }
            } else {
                saveStatus.innerHTML = '✅ Score saved locally! Sign in to save to your account.';
                saveStatus.style.color = '#7B6A8A';
            }
        });
    }

    // ============================================================
    // RESET
    // ============================================================
    function resetTest() {
        clearInterval(timerInterval);
        location.reload();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }
</script>

</body>
    </html>
