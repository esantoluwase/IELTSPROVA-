<body>

<div class="container">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <h1>📅 Study <span>Planner</span></h1>
        <span class="plan-badge" id="planBadge">🔒 Free</span>
    </div>

    <!-- ===== PLANNER CONTENT ===== -->
    <div id="plannerContent">
        <!-- Rendered by JavaScript -->
    </div>

    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
</div>

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCV8z2TqjtwR5LpSMlGn5jCsvw1IM5vMFQ",
        authDomain: "ieltsprova.firebaseapp.com",
        projectId: "ieltsprova",
        storageBucket: "ieltsprova.firebasestorage.app",
        messagingSenderId: "812300970124",
        appId: "1:812300970124:web:992398c08c151ae97df3a9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // STATE
    // ============================================================
    let userPlan = 'free';
    let userId = null;

    // ============================================================
    // CHECK LOGIN + LOAD USER PLAN
    // ============================================================
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'index.html';
            return;
        }

        userId = user.uid;

        try {
            const userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                const data = userDoc.data();
                userPlan = data.plan || 'free';
            }
        } catch (e) {
            console.log('Error loading user plan:', e);
        }

        // Update badge
        const badge = document.getElementById('planBadge');
        if (userPlan === 'free') {
            badge.textContent = '🔒 Free (Upgrade to Pro)';
            badge.className = 'plan-badge';
        } else if (userPlan === 'pro') {
            badge.textContent = '⭐ Pro';
            badge.className = 'plan-badge pro';
        } else {
            badge.textContent = '🚀 Pro+';
            badge.className = 'plan-badge proplus';
        }

        renderPlanner();
    });

    // ============================================================
    // RENDER PLANNER
    // ============================================================
    function renderPlanner() {
        const container = document.getElementById('plannerContent');

        if (userPlan === 'free') {
            container.innerHTML = `
                <div class="locked-overlay">
                    <span class="lock-icon">🔒</span>
                    <h2>Study Planner is a Pro Feature</h2>
                    <p>Get a personalized weekly study plan tailored to your goals.</p>
                    <p style="font-size:0.85rem;color:#7B6A8A;margin-bottom:1rem;">
                        ⭐ Pro: Weekly plans · 🚀 Pro+: Advanced AI planning
                    </p>
                    <a href="checkout.html" class="upgrade-link">⭐ Upgrade to Pro</a>
                </div>
            `;
            return;
        }

        // Get user's goal from localStorage or set default
        const savedGoal = localStorage.getItem('study_goal') || '7.0';
        const savedDays = parseInt(localStorage.getItem('study_days')) || 5;

        const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const today = new Date().getDay();
        const todayIndex = today === 0 ? 6 : today - 1;

        // Generate tasks for each day
        const modules = ['Reading', 'Writing', 'Listening', 'Speaking'];
        const taskTypes = ['Practice Test', 'Review Notes', 'Vocabulary', 'Mock Exam'];

        container.innerHTML = `
            <div class="planner-card">
                <h2>🎯 Your Study Goal</h2>
                <p>Set your target band score and how many days per week you want to study.</p>
                <div class="goal-input">
                    <input type="number" id="targetScore" value="${savedGoal}" min="4.0" max="9.0" step="0.5" />
                    <select id="studyDays">
                        <option value="3" ${savedDays === 3 ? 'selected' : ''}>3 days/week</option>
                        <option value="4" ${savedDays === 4 ? 'selected' : ''}>4 days/week</option>
                        <option value="5" ${savedDays === 5 ? 'selected' : ''}>5 days/week</option>
                        <option value="6" ${savedDays === 6 ? 'selected' : ''}>6 days/week</option>
                        <option value="7" ${savedDays === 7 ? 'selected' : ''}>7 days/week</option>
                    </select>
                    <button class="btn btn-primary" onclick="updateGoal()">
                        <i class="fas fa-save"></i> Update Plan
                    </button>
                </div>
            </div>

            <div class="planner-card">
                <h2>📅 Your Weekly Plan</h2>
                <p>${dayNames[todayIndex]} — Today's focus: ${modules[todayIndex % 4]}</p>
                <div class="days-grid">
                    ${dayNames.map((name, index) => {
                        const isToday = index === todayIndex;
                        const isPast = index < todayIndex;
                        const tasks = [
                            `${modules[index % 4]} Practice Test`,
                            `${modules[(index + 1) % 4]} Review`,
                            `Vocabulary Building`
                        ];
                        return `
                            <div class="day-card ${isToday ? 'today' : ''} ${isPast ? 'completed' : ''}">
                                <div class="day-name">${name}</div>
                                <div class="day-number">${isPast ? '✅' : isToday ? '📌' : '📅'}</div>
                                <div class="day-tasks">
                                    ${tasks.map(task => `
                                        <div class="task">
                                            <span>${task}</span>
                                            <span class="${isPast ? 'done' : isToday ? 'pending' : 'locked'}">
                                                ${isPast ? '✅' : isToday ? '⏳' : '🔒'}
                                            </span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>

            <div class="planner-card">
                <h2>📊 Weekly Progress</h2>
                <div style="display:flex;gap:1rem;flex-wrap:wrap;">
                    <div style="flex:1;min-width:150px;background:#faf7ff;padding:1rem;border-radius:16px;text-align:center;">
                        <div style="font-size:2rem;font-weight:900;color:#4A148C;">${todayIndex}</div>
                        <div style="font-size:0.85rem;color:#7B6A8A;">Days Completed</div>
                    </div>
                    <div style="flex:1;min-width:150px;background:#faf7ff;padding:1rem;border-radius:16px;text-align:center;">
                        <div style="font-size:2rem;font-weight:900;color:#FFD700;">${Math.round((todayIndex / 7) * 100)}%</div>
                        <div style="font-size:0.85rem;color:#7B6A8A;">Overall Progress</div>
                    </div>
                    <div style="flex:1;min-width:150px;background:#faf7ff;padding:1rem;border-radius:16px;text-align:center;">
                        <div style="font-size:2rem;font-weight:900;color:#4A148C;">${savedGoal}</div>
                        <div style="font-size:0.85rem;color:#7B6A8A;">Target Band</div>
                    </div>
                </div>
            </div>

            <div style="text-align:center;margin-top:1rem;">
                <button class="btn btn-success" onclick="startDailyTask()">
                    <i class="fas fa-play"></i> Start Today's Task
                </button>
                <button class="btn btn-secondary" onclick="resetPlan()" style="margin-left:0.5rem;">
                    <i class="fas fa-sync-alt"></i> Reset Plan
                </button>
            </div>
        `;
    }

    // ============================================================
    // UPDATE GOAL
    // ============================================================
    function updateGoal() {
        const targetScore = document.getElementById('targetScore').value;
        const studyDays = document.getElementById('studyDays').value;

        localStorage.setItem('study_goal', targetScore);
        localStorage.setItem('study_days', studyDays);

        alert('✅ Study plan updated!');
        renderPlanner();
    }

    // ============================================================
    // START DAILY TASK
    // ============================================================
    function startDailyTask() {
        const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const today = new Date().getDay();
        const todayIndex = today === 0 ? 6 : today - 1;
        const modules = ['Reading', 'Writing', 'Listening', 'Speaking'];

        alert(`📖 Today's task: ${modules[todayIndex % 4]} Practice Test\n\nGo to the Test section to start practicing!`);
        window.location.href = 'reading-test.html';
    }

    // ============================================================
    // RESET PLAN
    // ============================================================
    function resetPlan() {
        if (confirm('Reset your study plan?')) {
            localStorage.removeItem('study_goal');
            localStorage.removeItem('study_days');
            renderPlanner();
        }
    }
</script>

</body>
      </html>
