    </style>
</head>
<body>

<div class="container">

    <div class="test-header">
        <h1><i class="fas fa-headphones"></i> Listening Test</h1>
        <div class="meta">
            <span class="timer-box"><i class="fas fa-clock"></i> <span id="timerDisplay">30:00</span></span>
            <span class="plan-badge" id="planBadge">Free — 10 Qs</span>
        </div>
    </div>

    <!-- AUDIO PLAYER WITH TEXT-TO-SPEECH -->
    <div class="audio-player">
        <button class="play-btn" id="playAudioBtn"><i class="fas fa-play"></i> Play Audio</button>
        <div class="audio-status" id="audioStatus">
            <i class="fas fa-info-circle"></i> 
            <span>Click play to hear the recording. You will only hear it once.</span>
        </div>
        <div class="volume-control">
            <i class="fas fa-volume-down"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1" />
            <i class="fas fa-volume-up"></i>
        </div>
    </div>

    <div class="progress-indicator">
        <span id="progressText">Question 0 of 10</span>
        <div class="bar"><div class="fill" id="progressFill"></div></div>
    </div>

    <div class="section-label" id="sectionLabel">Section 1: Conversation</div>

    <form id="testForm"></form>

    <div class="actions">
        <button type="button" class="btn btn-primary" onclick="submitTest()"><i class="fas fa-check-circle"></i> Submit Test</button>
        <button type="button" class="btn btn-secondary" onclick="resetTest()"><i class="fas fa-sync-alt"></i> New Test</button>
        <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-chart-line"></i> Dashboard</a>
    </div>

    <div class="result" id="resultBox">
        <h2>📊 Your Score</h2>
        <div class="score-big"><span id="scoreDisplay">0</span> / <span id="totalQuestions">10</span></div>
        <div class="feedback-text" id="feedbackText"></div>
        <div class="save-status" id="saveStatus"></div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

</div>

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCV8z2TqjtwR5LpSMlGn5jCsvw1IM5vMFQ",
        authDomain: "ieltsprova.firebaseapp.com",
        projectId: "ieltsprova",
        storageBucket: "ieltsprova.firebasestorage.app",
        messagingSenderId: "812300970124",
        appId: "1:812300970124:web:992398c08c151ae97df3a9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // LISTENING QUESTION BANK
    // ============================================================
    const listeningQuestions = [
        { id: 1, section: 1, text: "What course does the student want to register for?", options: ["English Literature", "Creative Writing", "Introduction to Literature", "Modern Poetry"], answer: "A" },
        { id: 2, section: 1, text: "What is the student's student ID number?", options: ["2025-4789", "2025-4788", "2024-4789", "2025-4790"], answer: "A" },
        { id: 3, section: 1, text: "What days does the course meet?", options: ["Mondays and Wednesdays", "Tuesdays and Thursdays", "Mondays and Fridays", "Wednesdays and Fridays"], answer: "A" },
        { id: 4, section: 1, text: "What time does the course start?", options: ["9 AM", "10 AM", "11 AM", "1 PM"], answer: "B" },
        { id: 5, section: 1, text: "What prerequisite did the student complete?", options: ["English Literature", "Creative Writing", "Introduction to Literature", "Modern Poetry"], answer: "C" },
        { id: 6, section: 1, text: "Who is the student speaking to?", options: ["A professor", "A university advisor", "A librarian", "Another student"], answer: "B" },
        { id: 7, section: 1, text: "What semester did the student take the prerequisite course?", options: ["Last semester", "Last year", "Two semesters ago", "Currently"], answer: "A" },
        { id: 8, section: 1, text: "The advisor checks the student's...", options: ["Grades", "Student ID", "Eligibility", "Schedule"], answer: "C" },
        { id: 9, section: 1, text: "How does the student feel about the course schedule?", options: ["Disappointed", "Confused", "Happy", "Indifferent"], answer: "C" },
        { id: 10, section: 1, text: "What is the main purpose of this conversation?", options: ["To register for a course", "To change a course", "To ask about grades", "To cancel a registration"], answer: "A" },
        { id: 11, section: 2, text: "What is the name of the museum?", options: ["City Museum", "Natural History Museum", "Art Gallery", "Science Museum"], answer: "B" },
        { id: 12, section: 2, text: "What time does the museum open?", options: ["9 AM", "10 AM", "11 AM", "12 PM"], answer: "B" },
        { id: 13, section: 2, text: "What is the admission fee for adults?", options: ["$5", "$10", "$15", "$20"], answer: "B" },
        { id: 14, section: 2, text: "What exhibition is currently on display?", options: ["Ancient Egypt", "Dinosaurs", "Space Exploration", "Medieval Art"], answer: "A" },
        { id: 15, section: 2, text: "How long does the guided tour last?", options: ["30 minutes", "45 minutes", "60 minutes", "90 minutes"], answer: "C" },
        { id: 16, section: 2, text: "What is the museum's most popular exhibit?", options: ["The mummy room", "The dinosaur skeletons", "The space exhibit", "The art gallery"], answer: "A" },
        { id: 17, section: 2, text: "What discount is available for students?", options: ["10% off", "20% off", "30% off", "Free entry"], answer: "B" },
        { id: 18, section: 2, text: "Where is the museum located?", options: ["Near the train station", "In the city center", "On the university campus", "By the river"], answer: "B" },
        { id: 19, section: 2, text: "What facilities does the museum have?", options: ["A cafe", "A gift shop", "A library", "All of the above"], answer: "D" },
        { id: 20, section: 2, text: "What is the speaker's main purpose?", options: ["To promote the museum", "To explain the museum's history", "To give a tour", "To announce a new exhibit"], answer: "A" },
        { id: 21, section: 3, text: "What is the topic of the group project?", options: ["Climate Change", "Renewable Energy", "Ocean Pollution", "Urban Planning"], answer: "A" },
        { id: 22, section: 3, text: "How many students are in the group?", options: ["2", "3", "4", "5"], answer: "B" },
        { id: 23, section: 3, text: "What is the deadline for the project?", options: ["Next week", "In two weeks", "Next month", "In three weeks"], answer: "B" },
        { id: 24, section: 3, text: "What role does Sarah have in the group?", options: ["Researcher", "Editor", "Presenter", "Team Leader"], answer: "D" },
        { id: 25, section: 3, text: "What aspect of climate change are they focusing on?", options: ["Rising sea levels", "Extreme weather", "Melting glaciers", "All of the above"], answer: "D" },
        { id: 26, section: 3, text: "Where will they conduct their research?", options: ["The library", "Online databases", "Government archives", "All of the above"], answer: "D" },
        { id: 27, section: 3, text: "What is the presentation format?", options: ["PowerPoint", "Poster", "Video", "Interactive website"], answer: "A" },
        { id: 28, section: 3, text: "What challenge do they face?", options: ["Time management", "Research materials", "Group conflict", "Technical issues"], answer: "A" },
        { id: 29, section: 3, text: "What solution do they propose?", options: ["Meeting twice a week", "Using a shared calendar", "Dividing tasks clearly", "All of the above"], answer: "D" },
        { id: 30, section: 3, text: "What grade do they hope to achieve?", options: ["A", "B", "C", "D"], answer: "A" },
        { id: 31, section: 4, text: "What is the lecture about?", options: ["The history of space exploration", "The future of space travel", "Life on Mars", "Space technology"], answer: "A" },
        { id: 32, section: 4, text: "When was the first moon landing?", options: ["1965", "1969", "1972", "1980"], answer: "B" },
        { id: 33, section: 4, text: "What country was the first to launch a satellite?", options: ["USA", "Russia", "China", "France"], answer: "B" },
        { id: 34, section: 4, text: "What was the name of the first satellite?", options: ["Sputnik", "Apollo", "Voyager", "Explorer"], answer: "A" },
        { id: 35, section: 4, text: "What year was the International Space Station launched?", options: ["1998", "2000", "2002", "2005"], answer: "A" },
        { id: 36, section: 4, text: "What is the primary goal of space exploration?", options: ["Scientific discovery", "Commercial profit", "Military advantage", "Tourism"], answer: "A" },
        { id: 37, section: 4, text: "Which planet has been explored the most?", options: ["Mars", "Venus", "Saturn", "Jupiter"], answer: "A" },
        { id: 38, section: 4, text: "What are space probes used for?", options: ["To collect data", "To carry astronauts", "To build space stations", "To launch satellites"], answer: "A" },
        { id: 39, section: 4, text: "What is a major challenge of space travel?", options: ["Cost", "Radiation", "Isolation", "All of the above"], answer: "D" },
        { id: 40, section: 4, text: "What is the lecturer's main conclusion?", options: ["Space exploration is essential", "Space exploration is too expensive", "Space exploration is dangerous", "Space exploration is a waste of resources"], answer: "A" }
    ];

    const PLAN = 'free';

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const shuffled = shuffle([...listeningQuestions]);
    const limit = PLAN === 'free' ? 10 : listeningQuestions.length;
    const selected = shuffled.slice(0, limit);

    const answers = {};
    selected.forEach(q => {
        answers[`q${q.id}`] = q.answer;
    });

    function renderTest() {
        const container = document.getElementById('testForm');
        const totalSpan = document.getElementById('totalQuestions');
        const planBadge = document.getElementById('planBadge');

        if (PLAN === 'free') {
            planBadge.textContent = 'Free — 10 Qs';
            planBadge.className = 'plan-badge';
        } else {
            planBadge.textContent = 'Pro — All 40 Qs';
            planBadge.className = 'plan-badge pro';
        }

        totalSpan.textContent = selected.length;

        let html = '';
        let currentSection = 0;
        const sectionLabels = ['', 'Section 1: Conversation', 'Section 2: Monologue', 'Section 3: Group Project', 'Section 4: Lecture'];

        selected.forEach((q, index) => {
            if (q.section !== currentSection) {
                currentSection = q.section;
                html += `<div class="section-label" style="margin-top:1.5rem;">${sectionLabels[q.section]}</div>`;
            }

            const qNum = index + 1;
            const labels = ['A', 'B', 'C', 'D'];
            html += `<div class="question" data-index="${index}">
                <div class="q-number">Question ${qNum}</div>
                <p>${q.text}</p>`;
            q.options.forEach((opt, i) => {
                html += `<label>
                    <input type="radio" name="q${q.id}" value="${labels[i]}" onchange="updateProgress()" />
                    ${labels[i]}) ${opt}
                </label>`;
            });
            html += `</div>`;
        });

        container.innerHTML = html;
        updateProgress();
    }

    renderTest();

    function updateProgress() {
        const total = selected.length;
        let answered = 0;
        selected.forEach(q => {
            const checked = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (checked) answered++;
        });
        document.getElementById('progressText').textContent = `Question ${answered} of ${total}`;
        document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
    }

    // ============================================================
    // TIMER
    // ============================================================
    let timeLeft = 1800;
    const timerDisplay = document.getElementById('timerDisplay');

    function updateTimer() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert('⏰ Time is up! Your test will be submitted automatically.');
            submitTest();
        }
        timeLeft--;
    }

    const timerInterval = setInterval(updateTimer, 1000);
    updateTimer();

    // ============================================================
    // TEXT-TO-SPEECH AUDIO
    // ============================================================
    let isPlaying = false;
    let speechSynth = window.speechSynthesis;
    let currentUtterance = null;

    // Audio scripts for each section
    const audioScripts = {
        1: "Section 1. You will hear a conversation between a student and a university advisor. Student says: Hello, I'd like to register for the English Literature course. Advisor says: Certainly. Have you completed the prerequisite course? Student says: Yes, I completed Introduction to Literature last semester. Advisor says: Great. And what's your student ID number? Student says: It's 2025-4789. Advisor says: Let me check... Yes, you're eligible. The course meets on Mondays and Wednesdays at 10 AM. Student says: Perfect. I'll be there.",
        2: "Section 2. You will hear a museum guide giving a tour. Welcome to the Natural History Museum. We open at 10 AM every day. Admission for adults is $10. Our current exhibition is Ancient Egypt. The guided tour lasts approximately 60 minutes. Our most popular exhibit is the mummy room. Students get a 20 percent discount. We are located in the city center. We have a cafe, a gift shop, and a library. We hope you enjoy your visit.",
        3: "Section 3. You will hear a group of students discussing a project. Our group project is about climate change. There are three students in our group. The deadline is in two weeks. Sarah is our team leader. We are focusing on rising sea levels, extreme weather, and melting glaciers. We will conduct research in the library and online. Our presentation will be in PowerPoint. Our main challenge is time management. We plan to meet twice a week and use a shared calendar. We hope to achieve an A grade.",
        4: "Section 4. You will hear a lecture about space exploration. Today we will discuss the history of space exploration. The first moon landing was in 1969. Russia was the first country to launch a satellite. The first satellite was called Sputnik. The International Space Station was launched in 1998. The primary goal of space exploration is scientific discovery. Mars has been explored the most. Space probes collect data from distant planets. Major challenges include cost, radiation, and isolation. In conclusion, space exploration is essential for human progress."
    };

    // Get current section
    const currentSection = selected.length > 0 ? selected[0].section : 1;

    const playBtn = document.getElementById('playAudioBtn');
    const audioStatus = document.getElementById('audioStatus');
    const volumeSlider = document.getElementById('volumeSlider');

    playBtn.addEventListener('click', function() {
        if (isPlaying) {
            // Stop playback
            speechSynth.cancel();
            isPlaying = false;
            this.innerHTML = '<i class="fas fa-play"></i> Play Audio';
            this.classList.remove('playing');
            audioStatus.innerHTML = '<i class="fas fa-info-circle"></i> <span>Audio paused. Click play to restart.</span>';
            return;
        }

        // Start playback
        const script = audioScripts[currentSection] || audioScripts[1];
        
        // Cancel any ongoing speech
        speechSynth.cancel();

        // Create new utterance
        currentUtterance = new SpeechSynthesisUtterance(script);
        currentUtterance.rate = 0.9;
        currentUtterance.pitch = 1;
        currentUtterance.volume = parseFloat(volumeSlider.value);
        currentUtterance.lang = 'en-US';

        // Select a voice (prefer female voice if available)
        const voices = speechSynth.getVoices();
        const femaleVoice = voices.find(v => v.name.includes('Samantha') || v.name.includes('Google UK') || v.name.includes('Zira'));
        if (femaleVoice) {
            currentUtterance.voice = femaleVoice;
        }

        // Update UI
        isPlaying = true;
        this.innerHTML = '<i class="fas fa-stop"></i> Stop Audio';
        this.classList.add('playing');
        audioStatus.innerHTML = '<i class="fas fa-volume-up"></i> <span style="color:#4A148C;font-weight:600;">🔊 Audio is playing... Listen carefully.</span>';

        // Speak
        speechSynth.speak(currentUtterance);

        // When finished
        currentUtterance.onend = function() {
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i> Play Audio';
            playBtn.classList.remove('playing');
            audioStatus.innerHTML = '<i class="fas fa-check-circle" style="color:#2e7d32;"></i> <span style="color:#2e7d32;font-weight:600;">✅ Audio finished. You can now answer the questions.</span>';
        };

        currentUtterance.onerror = function() {
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i> Play Audio';
            playBtn.classList.remove('playing');
            audioStatus.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f57f17;"></i> <span>Audio playback error. Please try again.</span>';
        };
    });

    // Load voices when available
    if (speechSynth.getVoices().length === 0) {
        speechSynth.onvoiceschanged = function() {
            speechSynth.getVoices();
        };
    }

    // Volume control
    volumeSlider.addEventListener('input', function() {
        if (currentUtterance) {
            currentUtterance.volume = parseFloat(this.value);
        }
    });

    // ============================================================
    // SUBMIT TEST
    // ============================================================
    async function submitTest() {
        let score = 0;
        const total = selected.length;

        selected.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (selected && selected.value === q.answer) {
                score++;
            }
        });

        const resultBox = document.getElementById('resultBox');
        resultBox.classList.add('show');

        document.getElementById('scoreDisplay').textContent = score;

        const feedback = document.getElementById('feedbackText');
        const percentage = (score / total) * 100;
        if (percentage === 100) {
            feedback.innerHTML = '🌟 Perfect score! Excellent listening skills!';
        } else if (percentage >= 80) {
            feedback.innerHTML = '👏 Great job! You\'re well on your way to a high band.';
        } else if (percentage >= 60) {
            feedback.innerHTML = '💪 Good effort! Review the audio and try again.';
        } else {
            feedback.innerHTML = '📚 Keep practicing! Focus on understanding the main ideas.';
        }

        document.querySelectorAll('input').forEach(input => input.disabled = true);
        document.querySelector('.btn-primary').disabled = true;
        clearInterval(timerInterval);
        speechSynth.cancel();

        const saveStatus = document.getElementById('saveStatus');

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    await db.collection('scores').add({
                        userId: user.uid,
                        module: 'listening',
                        score: score,
                        total: total,
                        date: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    saveStatus.innerHTML = '✅ Score saved to your account! Check your dashboard.';
                    saveStatus.style.color = '#2e7d32';
                } catch (error) {
                    saveStatus.innerHTML = '⚠️ Score saved locally, but failed to sync to account.';
                    saveStatus.style.color = '#f57f17';
                }
            } else {
                saveStatus.innerHTML = '🔒 Sign in to save your scores to your account.';
                saveStatus.style.color = '#7B6A8A';
            }
        });
    }

    function resetTest() {
        speechSynth.cancel();
        location.reload();
    }
</script>
